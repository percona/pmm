---
name: Release notes check

on:
  pull_request:
    paths:
      - "documentation/docs/release-notes/**"
      - "documentation/resources/bin/rn-*"
      - "documentation/resources/bin/tests/**"
      - "documentation/resources/release-notes-template.md"

permissions:
  contents: read

jobs:
  check:
    name: Release notes
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the scripts
        run: npx --yes bats@1.11.0 documentation/resources/bin/tests

      - name: Check the notes in this PR
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" \
            -- documentation/docs/release-notes/unreleased/)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "This PR adds or changes no release notes."
            exit 0
          fi
          documentation/resources/bin/rn-check.sh "$BASE" "${files[@]}"

      # The "[Doc] Release X.Y.Z" PR merges only once every X.Y.Z note is on the page.
      - name: Check the release PR
        if: startsWith(github.head_ref, 'release-notes-')
        run: |
          version=${HEAD_REF#release-notes-}
          notes=$(mktemp -d)
          if git cat-file -e "origin/pmm-$version:documentation/docs/release-notes/unreleased"; then
            git archive "origin/pmm-$version" documentation/docs/release-notes/unreleased \
              | tar -x -C "$notes" --strip-components=4
          fi
          documentation/resources/bin/rn-gate.sh "$version" "$notes"
