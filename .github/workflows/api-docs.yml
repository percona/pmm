---
name: Sync API Docs
on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "documentation/api/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync API Docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect PMM version and API ID
        run: |
          # For reference:
          # PMM 2: VERSION=v2
          # PMM 3: VERSION=v3
          export VERSION=$(cat api/swagger/swagger.json | jq -r '.info.version')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: API
        uses: readmeio/rdme@191a35d0bbea63de193d0efb357efbc5c977c6b3 # v10.9.6
        with:
          rdme: openapi upload ./api/swagger/swagger.json --useSpecVersion --slug=pmm-api.json --key=${{ secrets.README_TOKEN }}

      - name: Markdown docs
        uses: readmeio/rdme@191a35d0bbea63de193d0efb357efbc5c977c6b3 # v10.9.6
        with:
          rdme: reference upload documentation/api/ --branch=${{ env.VERSION }}  --key=${{ secrets.README_TOKEN }}
