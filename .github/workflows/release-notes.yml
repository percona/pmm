---
name: Release notes

# check: on a PR, checks the release notes it adds. On a "[Doc] Release X.Y.Z" PR it also fails
#   until every X.Y.Z note is on the page.
# release-pr: when pmm-X.Y.Z is branched, and whenever a note lands on it, builds release-notes/X.Y.Z.md
#   from the notes on that branch into one draft "[Doc] Release X.Y.Z" PR to main, which also removes
#   those notes from main. Once merged, doc-hotfix copies it to pmm-X.Y.Z.
on:
  pull_request:
    paths:
      - ".github/workflows/release-notes.yml"
      - "documentation/docs/release-notes/**"
      - "documentation/resources/bin/release-notes.sh"
      - "documentation/resources/bin/tests/**"
      - "documentation/resources/release-notes-template.md"
  create:
  push:
    branches:
      - pmm-3.*
    paths:
      - "documentation/docs/release-notes/unreleased/**"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release, for example 3.11.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the script
        run: npx --yes bats@1.11.0 documentation/resources/bin/tests

      - name: Check the notes in this PR
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" \
            -- documentation/docs/release-notes/unreleased/)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "This PR adds or changes no release notes."
            exit 0
          fi
          documentation/resources/bin/release-notes.sh check "$BASE" "${files[@]}"

      - name: Check the release PR
        if: startsWith(github.head_ref, 'release-notes-')
        run: documentation/resources/bin/release-notes.sh gate "${HEAD_REF#release-notes-}"

  release-pr:
    name: Update the release PR
    # startsWith ignores case: 'pmm-3.' keeps PMM-12345-* branches out, 'pmm-' alone would not.
    if: >-
      github.repository == 'percona/pmm' && github.event_name != 'pull_request' &&
      (github.event_name != 'create' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'pmm-3.')))
    runs-on: ubuntu-latest
    # Every run rebuilds from the current branches, so a newer queued run can replace a pending one.
    concurrency:
      group: release-notes-${{ inputs.version && format('pmm-{0}', inputs.version) || github.ref_name }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.ROBOT_TOKEN }}

    steps:
      - name: Resolve the release
        id: release
        run: |
          version=${INPUT_VERSION:-${REF_NAME#pmm-}}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$REF_NAME is not a release branch"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release-notes-$version" >> "$GITHUB_OUTPUT"

      # ROBOT_TOKEN, unlike GITHUB_TOKEN, opens a PR that runs the PR checks.
      - name: Check out main
        if: steps.release.outputs.version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ROBOT_TOKEN }}

      - name: Build the page
        if: steps.release.outputs.version
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi

          documentation/resources/bin/release-notes.sh build "$VERSION"

          git add -A documentation
          if ! git diff --cached --quiet; then
            git commit -q -m "[Doc] Release $VERSION"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse --verify --quiet "origin/$BRANCH" || true)" ]; then
            git push origin "$BRANCH"
          fi

      - name: Open the PR
        if: steps.release.outputs.version
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            exit 0
          fi
          gh pr create --draft --base main --head "$BRANCH" --label doc-hotfix \
            --title "[Doc] Release $VERSION" --body-file - <<EOF
          Release notes for PMM $VERSION, built from the notes in \`documentation/docs/release-notes/unreleased/\` on \`pmm-$VERSION\`. The [Release notes workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release-notes.yml) updates this PR whenever a note lands on \`pmm-$VERSION\`, and keeps your edits.

          Merge it before GA. The \`doc-hotfix\` label copies it to \`pmm-$VERSION\`, which the site publishes from at GA.

          - [ ] Release summary
          - [ ] Release highlights
          - [ ] Security updates, or remove the section
          - [ ] Known issues, or remove the section
          - [ ] Release date in the page heading, the nav label, \`variables.yml\` and \`mkdocs-pdf.yml\`
          EOF

      # Notes for this version can no longer merge to main; tell the open PRs that carry one.
      - name: Comment on PRs with a note for this release
        if: steps.release.outputs.version && github.event_name != 'push'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          marker="<!-- release-notes-branched-$VERSION -->"
          for pr in $(gh pr list --base main --state open --limit 500 --json number --jq '.[].number'); do
            head=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            for file in $(gh pr view "$pr" --json files --jq '.files[].path' \
              | grep -E '^documentation/docs/release-notes/unreleased/PMM-[0-9]+\.md$'); do
              target=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$head" -H "Accept: application/vnd.github.raw" \
                | yq --front-matter=extract '.target // ""' 2>/dev/null || true)
              [ "$target" = "$VERSION" ] || continue
              if gh pr view "$pr" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
                continue
              fi
              gh pr comment "$pr" --body "$marker
          \`pmm-$VERSION\` is branched, so \`$file\` can no longer target $VERSION on \`main\`. Change its target to a later version, or open a PR against \`pmm-$VERSION\` if the change ships in $VERSION."
            done
          done
