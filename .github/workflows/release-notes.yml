---
name: Release notes

on:
  pull_request:
    paths:
      - ".github/workflows/release-notes.yml"
      - "documentation/resources/bin/release-notes.sh"
      - "documentation/resources/bin/tests/**"

permissions:
  contents: read

jobs:
  test:
    name: Release notes script
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the script
        run: npx --yes bats@1.11.0 documentation/resources/bin/tests
