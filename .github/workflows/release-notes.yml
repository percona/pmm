---
name: Release notes

# check: checks the release notes a PR adds; on the "[Doc] Release X.Y.Z" PR, also that no note is left out.
# release-pr: when pmm-X.Y.Z is branched, and whenever a note lands on it, builds release-notes/X.Y.Z.md
#   from the notes on that branch into one draft "[Doc] Release X.Y.Z" PR to main, which also deletes
#   those notes from main.
# copy: once that PR merges, copies it to pmm-X.Y.Z and deletes the notes there, so none is kept anywhere.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".github/workflows/release-notes.yml"
      - "documentation/docs/release-notes/**"
      - "documentation/resources/bin/release-notes.sh"
      - "documentation/resources/bin/tests/**"
      - "documentation/resources/release-notes-template.md"
  create:
  push:
    branches:
      - pmm-3.*
    paths:
      - "documentation/docs/release-notes/unreleased/**"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release, for example 3.11.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Release notes
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the script
        run: npx --yes bats@1.11.0 documentation/resources/bin/tests

      - name: Check the release notes
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" \
            -- documentation/docs/release-notes/unreleased/)
          documentation/resources/bin/release-notes.sh check "$HEAD_REF" "${files[@]}"

  release-pr:
    name: Update the release PR
    # startsWith ignores case: 'pmm-3.' keeps PMM-12345-* branches out, 'pmm-' alone would not.
    if: >-
      github.repository == 'percona/pmm' && github.event_name != 'pull_request' &&
      (github.event_name != 'create' || (github.ref_type == 'branch' && startsWith(github.ref_name, 'pmm-3.')))
    runs-on: ubuntu-latest
    # Every run rebuilds from the current branches, so a newer queued run can replace a pending one.
    concurrency:
      group: release-notes-${{ inputs.version && format('pmm-{0}', inputs.version) || github.ref_name }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.ROBOT_TOKEN }}

    steps:
      - name: Resolve the release
        id: release
        run: |
          version=${INPUT_VERSION:-${REF_NAME#pmm-}}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$REF_NAME is not a release branch"
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release-notes-$version" >> "$GITHUB_OUTPUT"

      # ROBOT_TOKEN, unlike GITHUB_TOKEN, opens a PR that runs the PR checks.
      - name: Check out main
        if: steps.release.outputs.version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ROBOT_TOKEN }}

      - name: Build the page
        if: steps.release.outputs.version
        id: build
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          # An open PR keeps its edits; otherwise start from main, also over the branch of a merged PR.
          if [ -n "$pr" ]; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi

          documentation/resources/bin/release-notes.sh build "$VERSION"

          git add -A documentation
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -q -m "[Doc] Release $VERSION"
          git push --force-with-lease origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.build.outputs.changed && !steps.build.outputs.pr
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          gh pr create --draft --base main --head "$BRANCH" \
            --title "[Doc] Release $VERSION" --body-file - <<EOF
          Release notes for PMM $VERSION, built from the notes in \`documentation/docs/release-notes/unreleased/\` on \`pmm-$VERSION\`. The [Release notes workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release-notes.yml) adds to this PR whenever a note lands on \`pmm-$VERSION\`, and keeps your edits.

          Merge it before GA. Merging copies the page to \`pmm-$VERSION\`, which the site publishes from at GA, and deletes the notes there.

          - [ ] Release summary
          - [ ] Release highlights
          - [ ] Security updates, or remove the section
          - [ ] Known issues, or remove the section
          - [ ] Release date in the page heading, the nav label, \`variables.yml\` and \`mkdocs-pdf.yml\`
          EOF

  copy:
    name: Copy the page to the release branch
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged && startsWith(github.head_ref, 'release-notes-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Resolve the release
        id: release
        run: echo "version=${HEAD_REF#release-notes-}" >> "$GITHUB_OUTPUT"

      # ROBOT_TOKEN can push to the protected release branch.
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pmm-${{ steps.release.outputs.version }}
          token: ${{ secrets.ROBOT_TOKEN }}

      - name: Copy the page and delete the notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"
          git fetch --depth=2 origin "$SHA"
          git diff --binary "${SHA}^1" "$SHA" -- documentation/ | git apply --index --3way
          NOTES_DIR=documentation/docs/release-notes/unreleased documentation/resources/bin/release-notes.sh build "$VERSION"
          git add -A documentation
          git commit -q -m "[Doc] Release $VERSION" -m "(cherry picked from commit $SHA)"
          git push origin "HEAD:pmm-$VERSION"
