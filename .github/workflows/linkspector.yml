---
name: Linkspector
on:
  pull_request:
    paths:
      - "documentation/**"
      - "!documentation/api/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to check links in."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check-links:
    name: linkspector
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Chrome for linkspector
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Configure Chrome path for puppeteer
        run: |
          # GitHub Actions runners execute Chrome as root, which requires the
          # sandbox to be disabled. Wrap the Chrome binary so linkspector's
          # bundled puppeteer always launches it with --no-sandbox, since
          # linkspector itself does not expose a way to pass launch args.
          cat <<'EOF' > /tmp/chrome-no-sandbox
          #!/bin/sh
          exec "${{ steps.setup-chrome.outputs.chrome-path }}" --no-sandbox --disable-setuid-sandbox "$@"
          EOF
          chmod +x /tmp/chrome-no-sandbox
          echo "PUPPETEER_EXECUTABLE_PATH=/tmp/chrome-no-sandbox" >> "$GITHUB_ENV"

      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@568ec8d29fa92b31fd9ea5381e155c51e922af83 # v1.5.5
        with:
          github_token: ${{ secrets.ROBOT_TOKEN || secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error
          filter_mode: nofilter
          config_file: documentation/.linkspector.yml
