---
name: UI

on:
  pull_request:
    paths-ignore:
      - "admin/**"
      - "agent/**"
      - "api-tests/**"
      - "dev/docs/**"
      - "documentation/**"
      - "managed/**"
      - "qan-api2/**"
      - "vmproxy/**"
      - "update/**"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/ui

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Verify plugin.json dashboard paths exist
        working-directory: ${{ github.workspace }}
        run: |
          missing=$(jq -r '.includes[] | select(.path) | .path' ui/apps/pmm-app/src/plugin.json \
            | while read -r p; do [ -f "$p" ] || echo "$p"; done)
          if [ -n "$missing" ]; then
            echo "::error::plugin.json references dashboard files that do not exist:"
            echo "$missing" | sed 's/^/  - /'
            exit 1
          fi

      - name: Check formatting
        run: make format-check

      - name: Run lint
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Build application
        run: make build
