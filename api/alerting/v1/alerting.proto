syntax = "proto3";

package alerting.v1;

import "alerting/v1/params.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "management/v1/severity.proto";
import "validate/validate.proto";

// BoolParamDefinition represents boolean parameter's default value.
message BoolParamDefinition {
  optional bool default = 1;
}

// FloatParamDefinition represents float parameter's default value and valid range.
message FloatParamDefinition {
  // Default value.
  optional double default = 1;
  // Minimum valid value (inclusive).
  optional double min = 2;
  // Maximum valid value (inclusive).
  optional double max = 3;
}

// StringParamDefinition represents string parameter's default value.
message StringParamDefinition {
  // Default value.
  optional string default = 1;
}

// ParamDefinition represents a single query parameter.
message ParamDefinition {
  // Machine-readable name (ID) that is used in expression.
  string name = 1 [(validate.rules).string.min_len = 1];
  // Short human-readable parameter summary.
  string summary = 2 [(validate.rules).string.min_len = 1];
  // Parameter unit. TODO: remove this parameter.
  ParamUnit unit = 3;
  // Parameter type.
  ParamType type = 4;
  // Parameter value.
  oneof value {
    // Bool value.
    BoolParamDefinition bool = 5;
    // Float value.
    FloatParamDefinition float = 6;
    // String value.
    StringParamDefinition string = 7;
  }
}

// TemplateSource defines template source.
enum TemplateSource {
  TEMPLATE_SOURCE_UNSPECIFIED = 0;
  // Template that is shipped with PMM Server releases.
  TEMPLATE_SOURCE_BUILT_IN = 1;
  // Template that is downloaded from check.percona.com.
  TEMPLATE_SOURCE_SAAS = 2;
  // Templated loaded from user-suplied file.
  TEMPLATE_SOURCE_USER_FILE = 3;
  // Templated created via API.
  TEMPLATE_SOURCE_USER_API = 4;
}

// TemplateQuery represents a PromQL query step in a multi-query alert template.
message TemplateQuery {
  // Reference ID of the query (e.g. "A").
  string ref_id = 1;
  // PromQL query expression with templating parameters (placeholders kept intact).
  string expr = 2;
}

// TemplateExpression represents a server-side expression step in a multi-query alert template.
message TemplateExpression {
  // Reference ID of the expression (e.g. "C").
  string ref_id = 1;
  // Expression type. Currently only "math" is supported.
  string type = 2;
  // Expression body referencing other steps by ref ID (e.g. "$A > $B").
  string expression = 3;
}

// Template represents Alert Template that is used to create Alert Rule.
message Template {
  // Machine-readable name (ID).
  string name = 1;
  // Short human-readable summary.
  string summary = 2;
  // PromQL query expression with templating parameters.
  string expr = 3;
  // Query parameters definitions.
  repeated ParamDefinition params = 4;
  // Default duration value.
  google.protobuf.Duration for = 5;
  // Severity.
  management.v1.Severity severity = 6;
  // Labels.
  map<string, string> labels = 7;
  // Annotations.
  map<string, string> annotations = 8;
  // Template source. Only templates created via API can be updated or deleted via API.
  TemplateSource source = 9;
  // Template creation time. Empty for built-in and SaaS templates.
  google.protobuf.Timestamp created_at = 10;
  // YAML template file content. Empty for built-in and SaaS templates.
  string yaml = 11;
  // PromQL query steps for multi-query templates. Empty for single-expression templates.
  repeated TemplateQuery queries = 12;
  // Server-side expression steps for multi-query templates. Empty for single-expression templates.
  repeated TemplateExpression expressions = 13;
  // Reference ID of the step used as the alert condition (e.g. "C"). Empty for single-expression templates.
  string condition = 14;
}

message ListTemplatesRequest {
  // Maximum number of results per page.
  optional int32 page_size = 1 [(validate.rules).int32.gte = 1];
  // Index of the requested page, starts from 0.
  optional int32 page_index = 2 [(validate.rules).int32.gte = 0];
  // If true, template files will be re-read from disk.
  bool reload = 3;
}

message ListTemplatesResponse {
  // Total number of results.
  int32 total_items = 1;
  // Total number of pages.
  int32 total_pages = 2;
  // Alerting templates.
  repeated Template templates = 3;
}

message CreateTemplateRequest {
  // YAML template file content.
  string yaml = 1 [(validate.rules).string.min_len = 1];
}

message CreateTemplateResponse {}

message UpdateTemplateRequest {
  // Machine-readable name (ID).
  string name = 1 [(validate.rules).string.min_len = 1];
  // YAML template file content.
  string yaml = 2 [(validate.rules).string.min_len = 1];
}

message UpdateTemplateResponse {}

message DeleteTemplateRequest {
  string name = 1 [(validate.rules).string.min_len = 1];
}

message DeleteTemplateResponse {}

// FilterType represents filter matching type.
enum FilterType {
  FILTER_TYPE_UNSPECIFIED = 0;
  FILTER_TYPE_MATCH = 1;
  FILTER_TYPE_MISMATCH = 2;
}

// Filter represents a single filter condition.
message Filter {
  FilterType type = 1;
  string label = 2;
  string regexp = 3;
}

// ParamValue represents a single rule parameter value.
message ParamValue {
  // Machine-readable name (ID) that is used in expression.
  string name = 1 [(validate.rules).string.min_len = 1];
  // Parameter type.
  ParamType type = 2;
  // Parameter value.
  oneof value {
    // Bool value.
    bool bool = 3;
    // Float value.
    double float = 4;
    // String value.
    string string = 5;
  }
}

message CreateRuleRequest {
  // Template name.
  string template_name = 1;
  // Rule name.
  string name = 2;
  // Rule group name.
  string group = 3;
  // Folder UID.
  string folder_uid = 4;
  // Rule parameters. All template parameters should be set.
  repeated ParamValue params = 5;
  // Rule duration. Should be set.
  google.protobuf.Duration for = 6;
  // Rule severity. Should be set.
  management.v1.Severity severity = 7;
  // All custom labels to add or remove (with empty values) to default labels from template.
  map<string, string> custom_labels = 8;
  // Filters.
  repeated Filter filters = 9;
  // Evaluation Interval
  google.protobuf.Duration interval = 10;
}

message CreateRuleResponse {
  // Identifier PMM assigns to a rule whose thresholds can be overridden per target.
  // Empty when the rule has no overridable parameters, since nothing can be keyed on it.
  // This is the rule's identity for threshold purposes rather than its Grafana UID:
  // copying or renaming the rule in Grafana preserves it.
  string rule_id = 1;
}

// ThresholdScope says what a threshold override's target refers to.
enum ThresholdScope {
  THRESHOLD_SCOPE_UNSPECIFIED = 0;
  // Target is a Node ID.
  THRESHOLD_SCOPE_NODE = 1;
  // Target is a Service ID.
  THRESHOLD_SCOPE_SERVICE = 2;
  // Target is a cluster label value.
  THRESHOLD_SCOPE_CLUSTER = 3;
}

// Threshold is one overridable parameter of one rule, as it applies to one target.
message Threshold {
  // Identifier PMM assigned to the rule. Not unique within a response: rules duplicated
  // in Grafana share it, so two entries can carry the same rule_id and param_name and
  // differ only in which rule they came from. Do not key a map on it.
  string rule_id = 1;
  // Machine-readable name of the overridable parameter.
  string param_name = 2;
  // Short human-readable parameter summary, as it was when the rule was created.
  string summary = 3;
  // Parameter unit.
  ParamUnit unit = 4;
  // Value the rule falls back to when no override applies.
  double default_value = 5;
  // Value the rule currently evaluates this target against.
  double effective_value = 6;
  // Whether effective_value comes from an override rather than the default.
  bool is_overridden = 7;
  // Scope the effective override was set at. Unspecified when not overridden.
  ThresholdScope scope = 8;
  // Target the effective override was set on. Empty when not overridden.
  string target = 9;
}

message ListThresholdsRequest {
  // Scope of the target to report thresholds for. Must be set together with target.
  ThresholdScope scope = 1;
  // Target to report thresholds for. When set, every overridable parameter is returned
  // for that target, overridden or not. When empty, only existing overrides are
  // returned, since there is otherwise no bounded set to enumerate.
  string target = 2;
  // Return only thresholds of this rule.
  string rule_id = 3;
}

message ListThresholdsResponse {
  repeated Threshold thresholds = 1;
}

message SetThresholdRequest {
  ThresholdScope scope = 1;
  string target = 2 [(validate.rules).string.min_len = 1];
  string rule_id = 3 [(validate.rules).string.min_len = 1];
  string param_name = 4 [(validate.rules).string.min_len = 1];
  // Must be finite and within the parameter's declared range.
  double value = 5;
}

message SetThresholdResponse {
  Threshold threshold = 1;
}

message ClearThresholdRequest {
  ThresholdScope scope = 1;
  string target = 2 [(validate.rules).string.min_len = 1];
  string rule_id = 3 [(validate.rules).string.min_len = 1];
  string param_name = 4 [(validate.rules).string.min_len = 1];
}

message ClearThresholdResponse {}

// ThresholdUpdate sets or clears one override.
message ThresholdUpdate {
  ThresholdScope scope = 1;
  string target = 2 [(validate.rules).string.min_len = 1];
  string rule_id = 3 [(validate.rules).string.min_len = 1];
  string param_name = 4 [(validate.rules).string.min_len = 1];
  // Omit to clear the override rather than set it.
  optional double value = 5;
}

message BatchUpdateThresholdsRequest {
  // Applied in one transaction: either every update lands or none does. A client
  // editing several rows at once cannot otherwise report which ones took effect.
  repeated ThresholdUpdate updates = 1 [(validate.rules).repeated.min_items = 1];
}

message BatchUpdateThresholdsResponse {
  // Thresholds that were set, in request order. Cleared ones are omitted.
  repeated Threshold thresholds = 1;
}

// Alerting service lets to manage alerting templates and create alerting rules from them.
service AlertingService {
  // ListTemplates returns a list of all collected alert rule templates.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {
    option (google.api.http) = {get: "/v1/alerting/templates"};
  }
  // CreateTemplate creates a new template.
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/alerting/templates"
      body: "*"
    };
  }
  // UpdateTemplate updates existing template, previously created via API.
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse) {
    option (google.api.http) = {
      put: "/v1/alerting/templates/{name}"
      body: "*"
    };
  }
  // DeleteTemplate deletes existing, previously created via API.
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse) {
    option (google.api.http) = {delete: "/v1/alerting/templates/{name}"};
  }
  // CreateRule creates alerting rule from the given template.
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse) {
    option (google.api.http) = {
      post: "/v1/alerting/rules"
      body: "*"
    };
  }
  // ListThresholds returns per-target threshold overrides.
  rpc ListThresholds(ListThresholdsRequest) returns (ListThresholdsResponse) {
    option (google.api.http) = {get: "/v1/alerting/thresholds"};
  }
  // SetThreshold overrides one rule parameter for one target.
  rpc SetThreshold(SetThresholdRequest) returns (SetThresholdResponse) {
    option (google.api.http) = {
      post: "/v1/alerting/thresholds"
      body: "*"
    };
  }
  // ClearThreshold removes an override so the target falls back to the rule's default,
  // or to a broader override still covering it.
  rpc ClearThreshold(ClearThresholdRequest) returns (ClearThresholdResponse) {
    option (google.api.http) = {delete: "/v1/alerting/thresholds"};
  }
  // BatchUpdateThresholds applies several set and clear operations in one transaction.
  rpc BatchUpdateThresholds(BatchUpdateThresholdsRequest) returns (BatchUpdateThresholdsResponse) {
    option (google.api.http) = {
      post: "/v1/alerting/thresholds:batchUpdate"
      body: "*"
    };
  }
}
