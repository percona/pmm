syntax = "proto3";

package realtimeanalytics.v1;

import "extensions/v1/redact.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// QueryMongoDBData holds MongoDB-specific Real-Time Analytics query information.
message QueryMongoDBData {
  // MongoDB instance address(host:port) that processing the query.
  string db_instance_address = 1;
  // Client application name from the MongoDB query.
  string client_app_name = 2;
  // Database name.
  string database_name = 3;
  // Collection name.
  string collection = 4;
  // Query operation ("find", "aggregate", "update", etc).
  string operation = 5;
  // The start time of the operation.
  google.protobuf.Timestamp operation_start_time = 6;
  // MongoDB user name associated with the query.
  string username = 7 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Indicates if an index (COLLSCAN vs IXSCAN) was utilized in the query.
  string plan_summary = 8;
}

// BlockedStatus says whether a statement is waiting for a lock.
enum BlockedStatus {
  // The lock graph could not be read, so nothing is known about this statement's waiting.
  BLOCKED_STATUS_UNSPECIFIED = 0;
  // The lock graph was read and this statement is not waiting for a lock.
  BLOCKED_STATUS_NOT_BLOCKED = 1;
  // The statement is waiting for a lock; blocked_by names the transactions holding it and
  // lock_type says which kind of lock is being waited on.
  BLOCKED_STATUS_BLOCKED = 2;
  // The connection was waiting for a lock on a later statement than the one reported, so
  // whether the reported statement was blocked is unknown.
  BLOCKED_STATUS_UNATTRIBUTED = 3;
}

// LockType says which of MySQL's two locking mechanisms a statement is waiting on; they are
// released differently, so clients should show them apart.
enum LockType {
  // The lock graph could not be read, or the statement is not waiting at all.
  LOCK_TYPE_UNSPECIFIED = 0;
  // An InnoDB row-level lock, read from performance_schema.data_lock_waits.
  LOCK_TYPE_ROW = 1;
  // A table metadata lock (MDL), read from performance_schema.metadata_locks. This is what
  // holds up DDL behind an open transaction, and any statement queued behind that DDL.
  LOCK_TYPE_METADATA = 2;
}

// BlockingTransaction describes a transaction holding a lock that a statement is waiting for.
message BlockingTransaction {
  // Connection id (processlist id) of the blocking transaction.
  int64 blocking_conn_id = 1;
  // The blocking connection's statement: its current statement, or the last statement
  // it ran when it sits idle inside an open transaction.
  string blocking_query = 2;
  // Command the blocking connection is executing ("Query", "Execute", ...).
  // "Sleep" means it is idle inside an open transaction and is running nothing at all.
  string blocking_command = 3;
  // MySQL user name of the blocking connection.
  string blocking_username = 4 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // How long the waiting statement has been waiting on this blocker.
  google.protobuf.Duration wait_duration = 5;
  // How long the blocking transaction has been open.
  google.protobuf.Duration blocker_transaction_duration = 6;
  // True when this blocker is not itself waiting for a lock (head of the blocking chain).
  // Several blockers of a statement can be marked; none are when the lock graph is a cycle.
  bool root = 7;
  // Lock mode this transaction holds on the contended object, e.g. "X,REC_NOT_GAP" for a row
  // lock or "SHARED_READ" for a metadata lock. Empty when the server did not report one.
  string blocking_lock_mode = 8;
  // True when blocking_query is not the whole statement; see QueryMySQLData.query_text_truncated.
  bool blocking_query_truncated = 9;
}

// QueryMySQLData holds MySQL-specific Real-Time Analytics query information, read from
// performance_schema.
message QueryMySQLData {
  // MySQL instance address(host:port) that processing the query.
  string db_instance_address = 1;
  // Client program name connected to MySQL, from the connection's program_name attribute.
  string program_name = 2;
  // Database name the connection is using.
  string database_name = 3;
  // Command type the connection is executing ("Query", "Execute", etc).
  string command = 4;
  // State of the connection/thread (for example "Sending data").
  string state = 5;
  // MySQL user name associated with the query.
  string username = 6 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Number of rows examined by the statement so far. Unset when the server did not measure it.
  optional int64 rows_examined = 7;
  // Number of rows sent by the statement so far. Unset when the server did not measure it.
  optional int64 rows_sent = 8;
  // Whether the statement performed a full table scan. Unset when the server did not measure it.
  optional bool full_scan = 9;
  // Whether the statement is waiting for a lock. UNSPECIFIED means the lock graph could not be
  // read (missing privilege, unsupported server, or too large), not "not blocked".
  BlockedStatus blocked_status = 10;
  // Transactions blocking this statement, ordered by connection id. Empty whenever
  // blocked_status is not BLOCKED.
  repeated BlockingTransaction blocked_by = 11;
  // Schema-qualified table the statement is waiting to lock. Empty unless blocked_status is BLOCKED.
  string locked_table = 12;
  // Index the statement is waiting to lock, for row locks only. Empty unless blocked_status is
  // BLOCKED.
  string locked_index = 13;
  // Which locking mechanism the statement is waiting on. UNSPECIFIED whenever blocked_status
  // is not BLOCKED.
  LockType lock_type = 14;
  // The lock mode the waiting statement asked for, in the same vocabulary as
  // BlockingTransaction.blocking_lock_mode. Empty unless blocked_status is BLOCKED.
  string requested_lock_mode = 15;
  // True when query_text reached MySQL's statement length limit (1024 bytes by default) or the
  // agent's 64 KiB cap, so it may not be the whole statement.
  bool query_text_truncated = 16;
  // Time the statement has spent waiting for table locks, from
  // events_statements_current.LOCK_TIME. Unset when the server did not measure it.
  google.protobuf.Duration lock_time = 17;
}

// QueryData represents a single Real-Time Analytics query data point.
// It includes general query information and a payload for database-specific details.
message QueryData {
  // PMM Service identifier that reported the query.
  string service_id = 1;
  // PMM Service name that reported the query.
  string service_name = 2;
  // Unique identifier for the query.
  string query_id = 3;
  // The text of the query.
  string query_text = 4;
  // Raw JSON representation of the query.
  string query_raw_json = 5;
  // Current query current execution time.
  google.protobuf.Duration query_execution_duration = 6;
  // Timestamp when the query data was collected by Real-Time Analytics agent.
  google.protobuf.Timestamp query_collect_time = 7;
  // Client address (host:port).
  string client_address = 8;
  // Database-specific payload.
  oneof payload {
    // MongoDB-specific query data.
    QueryMongoDBData mongo_db_payload = 9;
    // MySQL-specific query data.
    QueryMySQLData my_sql_payload = 10;
  }
}
