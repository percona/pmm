syntax = "proto3";

package advisors.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "management/v1/severity.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

// AdvisorCheckInterval represents possible execution interval values for checks.
enum AdvisorCheckInterval {
  ADVISOR_CHECK_INTERVAL_UNSPECIFIED = 0;
  ADVISOR_CHECK_INTERVAL_STANDARD = 1;
  ADVISOR_CHECK_INTERVAL_FREQUENT = 2;
  ADVISOR_CHECK_INTERVAL_RARE = 3;
}

enum AdvisorCheckFamily {
  ADVISOR_CHECK_FAMILY_UNSPECIFIED = 0;
  ADVISOR_CHECK_FAMILY_MYSQL = 1;
  ADVISOR_CHECK_FAMILY_POSTGRESQL = 2;
  ADVISOR_CHECK_FAMILY_MONGODB = 3;
}

// AdvisorCheckResultStatus represents the outcome of an Advisor check run against a service.
enum AdvisorCheckResultStatus {
  ADVISOR_CHECK_RESULT_STATUS_UNSPECIFIED = 0;
  // The check ran and found no issue.
  ADVISOR_CHECK_RESULT_STATUS_OK = 1;
  // The check ran and detected an issue.
  ADVISOR_CHECK_RESULT_STATUS_FAILED = 2;
  // The check could not be executed.
  ADVISOR_CHECK_RESULT_STATUS_ERROR = 3;
}

// AdvisorCheckTriggeredBy represents the actor that initiated an Advisor check run.
enum AdvisorCheckTriggeredBy {
  ADVISOR_CHECK_TRIGGERED_BY_UNSPECIFIED = 0;
  // The run was started by a user via the API or UI.
  ADVISOR_CHECK_TRIGGERED_BY_USER = 1;
  // The run was started by the built-in scheduler.
  ADVISOR_CHECK_TRIGGERED_BY_SCHEDULER = 2;
}

// AdvisorCheckResult represents the check result returned from pmm-managed after running the check.
message AdvisorCheckResult {
  string summary = 1;
  string description = 2;
  management.v1.Severity severity = 3;
  map<string, string> labels = 4;
  // URL containing information on how to resolve an issue detected by an Advisor check.
  string read_more_url = 5;
  // Name of the monitored service on which the check ran.
  string service_name = 6;
}

// CheckResultSummary is a summary of check results.
message CheckResultSummary {
  string service_name = 1;
  string service_id = 2;
  // Number of failed checks for this service with severity level "EMERGENCY".
  uint32 emergency_count = 3;
  // Number of failed checks for this service with severity level "ALERT".
  uint32 alert_count = 4;
  // Number of failed checks for this service with severity level "CRITICAL".
  uint32 critical_count = 5;
  // Number of failed checks for this service with severity level "ERROR".
  uint32 error_count = 6;
  // Number of failed checks for this service with severity level "WARNING".
  uint32 warning_count = 7;
  // Number of failed checks for this service with severity level "NOTICE".
  uint32 notice_count = 8;
  // Number of failed checks for this service with severity level "INFO".
  uint32 info_count = 9;
  // Number of failed checks for this service with severity level "DEBUG".
  uint32 debug_count = 10;
}

// CheckResult represents the check results for a given service.
message CheckResult {
  string summary = 1;
  string description = 2;
  management.v1.Severity severity = 3;
  map<string, string> labels = 4;
  // URL containing information on how to resolve an issue detected by an Advisor check.
  string read_more_url = 5;
  // Name of the monitored service on which the check ran.
  string service_name = 6;
  // ID of the monitored service on which the check ran.
  string service_id = 7;
  // Name of the check that failed
  string check_name = 8;
  // Silence status of the check result
  bool silenced = 10;
}

// AdvisorCheckQuery is a single data-collection query of an advisor check.
message AdvisorCheckQuery {
  // Query type, e.g. "MYSQL_SHOW", "POSTGRESQL_SELECT", "METRICS_RANGE".
  string type = 1;
  // Query text (may be empty for parameterless types such as MYSQL_SHOW).
  string query = 2;
  // Optional query parameters (e.g. range/step for metrics range queries).
  map<string, string> parameters = 3;
}

// AdvisorCheck contains check name and status.
message AdvisorCheck {
  // Machine-readable name (ID) that is used in expression.
  string name = 1 [(validate.rules).string = {
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
    max_len: 128
  }];
  // True if that check is enabled.
  bool enabled = 2;
  // Long human-readable description.
  string description = 3;
  // Short human-readable summary.
  string summary = 4;
  // Check execution interval.
  AdvisorCheckInterval interval = 5;
  // DB family.
  AdvisorCheckFamily family = 6;
  // Category (top-level grouping).
  string category = 7;
  // Subcategory (second-level grouping within a category).
  string subcategory = 8;
  // True if the check is user-authored (editable/deletable); false for Percona-shipped checks.
  bool user_defined = 9;
  // Data-collection queries. Populated by Get/Create/Update; may be empty in list responses.
  repeated AdvisorCheckQuery queries = 10;
  // Starlark source script. Populated by Get/Create/Update; may be empty in list responses.
  string script = 11;
  // IDs of services for which this check is disabled.
  repeated string disabled_service_ids = 12;
}

message Advisor {
  // Deprecated: no longer populated; an advisor is identified by its category/subcategory pair.
  string name = 1 [deprecated = true];
  // Deprecated: advisor descriptions were removed.
  string description = 2 [deprecated = true];
  // Deprecated: use subcategory instead.
  string summary = 3 [deprecated = true];
  // Deprecated: no longer populated.
  string comment = 4 [deprecated = true];
  // Category (top-level grouping).
  string category = 5;
  // Subcategory (second-level grouping within a category).
  string subcategory = 6;
  // Advisor checks.
  repeated AdvisorCheck checks = 7;
}

// ChangeAdvisorCheckParams specifies a single check parameters.
message ChangeAdvisorCheckParams {
  // The name of the check to change.
  string name = 1;
  optional bool enable = 2;
  // check execution interval.
  AdvisorCheckInterval interval = 4;
  // IDs of services to apply the enable/disable to. When set, enable/disable
  // affects only the given services instead of the whole check; interval
  // changes are not allowed in the same params entry.
  repeated string service_ids = 5;
}

message StartAdvisorChecksRequest {
  // Names of the checks that should be started.
  repeated string names = 1;
}

message StartAdvisorChecksResponse {
  // ID assigned to this batch; all check results produced by it share this batch_id.
  string batch_id = 1;
}

message ListAdvisorChecksRequest {}

message ListAdvisorChecksResponse {
  repeated AdvisorCheck checks = 1;
}

message GetAdvisorCheckScriptRequest {
  // Machine-readable name (ID) of the check.
  string name = 1;
}

message GetAdvisorCheckScriptResponse {
  // Source script (Starlark) of the check.
  string script = 1;
}

message GetAdvisorCheckRequest {
  // Machine-readable name (ID) of the check.
  string name = 1;
}

message GetAdvisorCheckResponse {
  AdvisorCheck check = 1;
}

message CreateAdvisorCheckRequest {
  // The check to create. Its name must be unique across all checks.
  AdvisorCheck check = 1;
}

message CreateAdvisorCheckResponse {
  AdvisorCheck check = 1;
}

message UpdateAdvisorCheckRequest {
  // Machine-readable name (ID) of the check to update.
  string name = 1;
  // The updated check definition.
  AdvisorCheck check = 2;
}

message UpdateAdvisorCheckResponse {
  AdvisorCheck check = 1;
}

message DeleteAdvisorCheckRequest {
  // Machine-readable name (ID) of the check to delete.
  string name = 1;
}

message DeleteAdvisorCheckResponse {}

message TestAdvisorCheckRequest {
  // Check definition to execute; it is not saved.
  AdvisorCheck check = 1;
  // ID of the service to run the check against.
  string service_id = 2 [(validate.rules).string.min_len = 1];
}

// TestAdvisorCheckResult is a single finding produced by a test (dry-run) check execution.
message TestAdvisorCheckResult {
  string summary = 1;
  string description = 2;
  management.v1.Severity severity = 3;
  map<string, string> labels = 4;
  // URL containing information on how to resolve an issue detected by the check.
  string read_more_url = 5;
  // Name of the monitored service on which the check ran.
  string service_name = 6;
  // ID of the monitored service on which the check ran.
  string service_id = 7;
  // Name of the tested check.
  string check_name = 8;
}

message TestAdvisorCheckResponse {
  // Findings produced by the check script; empty means the check passed.
  repeated TestAdvisorCheckResult results = 1;
  // Output produced by the script's print() calls, for debugging.
  string script_output = 2;
}

message ListAdvisorsRequest {}

message ListAdvisorsResponse {
  repeated Advisor advisors = 1;
}

message ChangeAdvisorChecksRequest {
  repeated ChangeAdvisorCheckParams params = 1;
}

message ChangeAdvisorChecksResponse {}

message ListFailedServicesRequest {}

message ListFailedServicesResponse {
  repeated CheckResultSummary result = 1;
}

message GetFailedChecksRequest {
  // Maximum number of results per page.
  optional int32 page_size = 1 [(validate.rules).int32.gte = 1];
  // Index of the requested page, starts from 0.
  optional int32 page_index = 2 [(validate.rules).int32.gte = 0];
  // Service ID.
  string service_id = 3;
}

message GetFailedChecksResponse {
  // Total number of results.
  int32 total_items = 1;
  // Total number of pages.
  int32 total_pages = 2;
  // Check results
  repeated CheckResult results = 3;
}

// CheckResultHistoryItem represents a single persisted Advisor check run against a service.
message CheckResultHistoryItem {
  // Unique identifier of the history record.
  string id = 1;
  // ID of the batch this result belongs to; all results produced by one execution share it.
  string batch_id = 2;
  // Name of the check that ran.
  string check_name = 3;
  // Category the check belongs to (top-level grouping).
  string category = 4;
  // Subcategory the check belongs to (second-level grouping within a category).
  string subcategory = 5;
  // Check execution interval.
  AdvisorCheckInterval interval = 6;
  // ID of the monitored service on which the check ran.
  string service_id = 7;
  // Name of the monitored service on which the check ran.
  string service_name = 8;
  // Type of the monitored service on which the check ran.
  string service_type = 9;
  // ID of the node the service runs on.
  string node_id = 10;
  // Name of the node the service runs on.
  string node_name = 11;
  // Environment of the monitored service on which the check ran.
  string environment = 12;
  // Cluster of the monitored service on which the check ran.
  string cluster = 13;
  // Replication set of the monitored service on which the check ran.
  string replication_set = 14;
  // Outcome of the check run.
  AdvisorCheckResultStatus status = 15;
  // Short human-readable summary of the result.
  string summary = 16;
  // Long human-readable description of the result.
  string description = 17;
  // URL containing information on how to resolve a detected issue.
  string read_more_url = 18;
  // Output returned by the check run (finding details or execution error).
  string outcome = 19;
  // Severity of the result.
  management.v1.Severity severity = 20;
  // Result labels.
  map<string, string> labels = 21;
  // Time when the check ran.
  google.protobuf.Timestamp checked_at = 22;
  // Whether the result has been marked as read.
  bool is_read = 23;
  // The actor that initiated the run.
  AdvisorCheckTriggeredBy triggered_by = 24;
}

message ListCheckResultsHistoryRequest {
  // Maximum number of results per page.
  optional int32 page_size = 1 [(validate.rules).int32.gte = 1];
  // Index of the requested page, starts from 0.
  optional int32 page_index = 2 [(validate.rules).int32.gte = 0];
  // Filter by service ID.
  string service_id = 3;
  // Filter by outcome.
  optional AdvisorCheckResultStatus status = 4;
  // Filter by read state.
  optional bool is_read = 5;
  // Return only results recorded at or after this time.
  google.protobuf.Timestamp from = 6;
  // Return only results recorded at or before this time.
  google.protobuf.Timestamp to = 7;
  // Filter by service name (partial, case-insensitive match).
  string service_name = 8;
  // Filter by node name (partial, case-insensitive match).
  string node_name = 9;
  // Filter by advisor category.
  string category = 10;
  // Filter by check name.
  string check_name = 11;
  // Filter by severity.
  optional management.v1.Severity severity = 12;
  // Filter by batch ID.
  string batch_id = 13;
  // Filter by the actor that initiated the run.
  optional AdvisorCheckTriggeredBy triggered_by = 14;
}

message ListCheckResultsHistoryResponse {
  // Total number of results.
  int32 total_items = 1;
  // Total number of pages.
  int32 total_pages = 2;
  // History records.
  repeated CheckResultHistoryItem results = 3;
}

message ListCheckResultsFilterValuesRequest {}

message ListCheckResultsFilterValuesResponse {
  // Distinct service names present in the check results history, sorted alphabetically.
  repeated string service_names = 1;
  // Distinct node names present in the check results history, sorted alphabetically.
  repeated string node_names = 2;
}

message MarkCheckResultsReadRequest {
  // IDs of the history records to update.
  repeated string ids = 1 [(validate.rules).repeated.min_items = 1];
  // Read state to set on the records.
  bool is_read = 2;
}

message MarkCheckResultsReadResponse {}

// AdvisorService service provides public Management API methods for Advisor Service.
service AdvisorService {
  // ListFailedServices returns a list of services with failed checks.
  rpc ListFailedServices(ListFailedServicesRequest) returns (ListFailedServicesResponse) {
    option (google.api.http) = {get: "/v1/advisors/failedServices"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Failed Services"
      description: "Returns a list of services with failed checks and a summary of check results."
    };
  }
  // GetFailedChecks returns the checks result for a given service.
  rpc GetFailedChecks(GetFailedChecksRequest) returns (GetFailedChecksResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks/failed"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Failed Advisor Checks"
      description: "Returns the latest check results for a given service."
    };
  }
  // ListCheckResultsHistory returns the history of Advisor check runs.
  rpc ListCheckResultsHistory(ListCheckResultsHistoryRequest) returns (ListCheckResultsHistoryResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks/history"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Check Results History"
      description: "Returns the history of Advisor check runs, including their outcomes."
    };
  }
  // ListCheckResultsFilterValues returns the distinct values usable as history filters.
  rpc ListCheckResultsFilterValues(ListCheckResultsFilterValuesRequest) returns (ListCheckResultsFilterValuesResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks/history:filterValues"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Check Results Filter Values"
      description: "Returns the distinct service and node names present in the Advisor check results history, for populating filter dropdowns."
    };
  }
  // MarkCheckResultsRead sets the read state on Advisor check history records.
  rpc MarkCheckResultsRead(MarkCheckResultsReadRequest) returns (MarkCheckResultsReadResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks/history:markRead"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Mark Advisor Check Results Read"
      description: "Sets the read state on the specified Advisor check history records. Set is_read to false to mark them unread."
    };
  }
  // StartAdvisorChecks executes Advisor checks and returns when all checks are executed.
  rpc StartAdvisorChecks(StartAdvisorChecksRequest) returns (StartAdvisorChecksResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks:start"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Start Advisor Checks"
      description: "Executes Advisor checks and returns when all checks are executed. All available checks will be started if check names aren't specified."
    };
  }
  // ListAdvisorChecks returns a list of advisor checks available to the user..
  rpc ListAdvisorChecks(ListAdvisorChecksRequest) returns (ListAdvisorChecksResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Checks"
      description: "List advisor checks available to the user."
    };
  }
  // GetAdvisorCheckScript returns the source script of a single advisor check.
  rpc GetAdvisorCheckScript(GetAdvisorCheckScriptRequest) returns (GetAdvisorCheckScriptResponse) {
    // deeper path than /checks/{failed,history} so the wildcard cannot shadow them
    option (google.api.http) = {get: "/v1/advisors/checks/{name}/script"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Advisor Check Script"
      description: "Returns the source script of a single advisor check by name."
    };
  }
  // ListAdvisors returns a list of advisors available for the user.
  rpc ListAdvisors(ListAdvisorsRequest) returns (ListAdvisorsResponse) {
    option (google.api.http) = {get: "/v1/advisors"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisors"
      description: "List advisors available to the user."
    };
  }
  // ChangeAdvisorChecks enables/disables Advisor checks or changes their exec interval.
  rpc ChangeAdvisorChecks(ChangeAdvisorChecksRequest) returns (ChangeAdvisorChecksResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks:batchChange"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Change Advisor Checks"
      description: "Enables/disables advisor checks or changes their exec interval."
    };
  }
  // GetAdvisorCheck returns a single advisor check by name, including its queries and script.
  rpc GetAdvisorCheck(GetAdvisorCheckRequest) returns (GetAdvisorCheckResponse) {
    // deeper path than /checks/{failed,history} so the {name} wildcard cannot shadow them
    option (google.api.http) = {get: "/v1/advisors/checks/{name}/definition"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Advisor Check"
      description: "Returns a single advisor check by name, including its queries and script."
    };
  }
  // CreateAdvisorCheck creates a new user-authored advisor check.
  rpc CreateAdvisorCheck(CreateAdvisorCheckRequest) returns (CreateAdvisorCheckResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Advisor Check"
      description: "Creates a new user-authored advisor check."
    };
  }
  // UpdateAdvisorCheck updates an existing user-authored advisor check.
  rpc UpdateAdvisorCheck(UpdateAdvisorCheckRequest) returns (UpdateAdvisorCheckResponse) {
    option (google.api.http) = {
      put: "/v1/advisors/checks/{name}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update Advisor Check"
      description: "Updates an existing user-authored advisor check. Percona-shipped checks cannot be modified."
    };
  }
  // TestAdvisorCheck executes an advisor check definition without saving it.
  rpc TestAdvisorCheck(TestAdvisorCheckRequest) returns (TestAdvisorCheckResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks:test"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Test Advisor Check"
      description: "Executes an advisor check definition against a single service without saving the check; results are returned and not persisted."
    };
  }
  // DeleteAdvisorCheck deletes a user-authored advisor check.
  rpc DeleteAdvisorCheck(DeleteAdvisorCheckRequest) returns (DeleteAdvisorCheckResponse) {
    option (google.api.http) = {delete: "/v1/advisors/checks/{name}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete Advisor Check"
      description: "Deletes a user-authored advisor check. Percona-shipped checks cannot be deleted."
    };
  }
}
