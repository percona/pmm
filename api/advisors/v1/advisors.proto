syntax = "proto3";

package advisors.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "management/v1/severity.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "validate/validate.proto";

enum AdvisorCheckTechnology {
  ADVISOR_CHECK_TECHNOLOGY_UNSPECIFIED = 0;
  ADVISOR_CHECK_TECHNOLOGY_MYSQL = 1;
  ADVISOR_CHECK_TECHNOLOGY_POSTGRESQL = 2;
  ADVISOR_CHECK_TECHNOLOGY_MONGODB = 3;
}

// AdvisorCheckResultStatus represents the outcome of an Advisor check run against a service.
enum AdvisorCheckResultStatus {
  ADVISOR_CHECK_RESULT_STATUS_UNSPECIFIED = 0;
  // The check ran and found no issue.
  ADVISOR_CHECK_RESULT_STATUS_OK = 1;
  // The check ran and detected an issue.
  ADVISOR_CHECK_RESULT_STATUS_FAILED = 2;
  // The check could not be executed.
  ADVISOR_CHECK_RESULT_STATUS_ERROR = 3;
  // The run has planned the check but not executed it yet.
  ADVISOR_CHECK_RESULT_STATUS_PENDING = 4;
  // The run ended before executing the check.
  ADVISOR_CHECK_RESULT_STATUS_NOT_RUN = 5;
}

// AdvisorCheckTriggeredBy represents the actor that initiated an Advisor check run.
enum AdvisorCheckTriggeredBy {
  ADVISOR_CHECK_TRIGGERED_BY_UNSPECIFIED = 0;
  // The run was started by a user via the API or UI.
  ADVISOR_CHECK_TRIGGERED_BY_USER = 1;
  // The run was started by the built-in scheduler.
  ADVISOR_CHECK_TRIGGERED_BY_SCHEDULER = 2;
}

// AdvisorCheckQuery is a single data-collection query of an advisor check.
message AdvisorCheckQuery {
  // Query type, e.g. "MYSQL_SHOW", "POSTGRESQL_SELECT", "METRICS_RANGE".
  string type = 1;
  // Query text (may be empty for parameterless types such as MYSQL_SHOW).
  string query = 2;
  // Optional query parameters (e.g. range/step for metrics range queries).
  map<string, string> parameters = 3;
}

// AdvisorCheck contains check name and status.
message AdvisorCheck {
  // Machine-readable name (ID) that is used in expression.
  string name = 1 [(validate.rules).string = {
    pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
    max_len: 128
  }];
  // True if that check is enabled.
  bool enabled = 2;
  // Long human-readable description.
  string description = 3;
  // Short human-readable summary.
  string summary = 4;
  // Field 5 (interval) was removed when Advisor schedules replaced check intervals.
  reserved 5;
  reserved "interval";
  // DB technology.
  AdvisorCheckTechnology technology = 6;
  // Category the check belongs to.
  string category = 7;
  // True if the check is user-authored (editable/deletable); false for Percona-shipped checks.
  bool user_defined = 8;
  // Data-collection queries. Populated by Get/Create/Update; may be empty in list responses.
  repeated AdvisorCheckQuery queries = 9;
  // Starlark source script. Populated by Get/Create/Update; may be empty in list responses.
  string script = 10;
  // IDs of services for which this check is disabled.
  repeated string disabled_service_ids = 11;
}

// AdvisorCheckDefinition is the editable content of a user-authored check.
message AdvisorCheckDefinition {
  // Long human-readable description.
  string description = 1;
  // Short human-readable summary.
  string summary = 2;
  // Field 3 (interval) was removed when Advisor schedules replaced check intervals.
  reserved 3;
  reserved "interval";
  // DB technology.
  AdvisorCheckTechnology technology = 4;
  // Category the check belongs to.
  string category = 5;
  // Data-collection queries.
  repeated AdvisorCheckQuery queries = 6;
  // Starlark source script.
  string script = 7;
}

// ChangeAdvisorCheckParams specifies a single check parameters.
message ChangeAdvisorCheckParams {
  // The name of the check to change.
  string name = 1;
  optional bool enable = 2;
  // Field 4 (interval) was removed when Advisor schedules replaced check intervals.
  reserved 4;
  reserved "interval";
  // IDs of services to apply the enable/disable to. When set, enable/disable
  // affects only the given services instead of the whole check.
  repeated string service_ids = 5;
}

message StartAdvisorChecksRequest {
  // Names of the checks that should be started.
  repeated string names = 1;
  // IDs of the services to run the checks against. When empty, the checks run
  // against every monitored service of a matching technology.
  repeated string service_ids = 2;
  // Field 3 (intervals) was removed when Advisor schedules replaced check intervals.
  reserved 3;
  reserved "intervals";
}

message StartAdvisorChecksResponse {
  // ID assigned to this run; all check results produced by it share this run_id.
  string run_id = 1;
}

message ListAdvisorChecksRequest {}

message ListAdvisorChecksResponse {
  repeated AdvisorCheck checks = 1;
}

message GetAdvisorCheckRequest {
  // Machine-readable name (ID) of the check.
  string name = 1;
}

message GetAdvisorCheckResponse {
  AdvisorCheck check = 1;
}

message CreateAdvisorCheckRequest {
  // The check to create. Its name must be unique across all checks.
  AdvisorCheck check = 1;
}

message CreateAdvisorCheckResponse {
  AdvisorCheck check = 1;
}

message UpdateAdvisorCheckRequest {
  // Machine-readable name (ID) of the check to update. A check cannot be renamed.
  string name = 1;
  // The updated check definition.
  AdvisorCheckDefinition check = 2;
}

message UpdateAdvisorCheckResponse {
  AdvisorCheck check = 1;
}

message DeleteAdvisorCheckRequest {
  // Machine-readable name (ID) of the check to delete.
  string name = 1;
}

message DeleteAdvisorCheckResponse {}

message TestAdvisorCheckRequest {
  // Check definition to execute; it is not saved.
  AdvisorCheck check = 1;
  // ID of the service to run the check against.
  string service_id = 2 [(validate.rules).string.min_len = 1];
}

// TestAdvisorCheckResult is a single finding produced by a test (dry-run) check execution.
message TestAdvisorCheckResult {
  string summary = 1;
  string description = 2;
  management.v1.Severity severity = 3;
  map<string, string> labels = 4;
  // URL containing information on how to resolve an issue detected by the check.
  string read_more_url = 5;
  // Name of the monitored service on which the check ran.
  string service_name = 6;
  // ID of the monitored service on which the check ran.
  string service_id = 7;
  // Name of the tested check.
  string check_name = 8;
}

message TestAdvisorCheckResponse {
  // Findings produced by the check script; empty means the check passed.
  repeated TestAdvisorCheckResult results = 1;
  // Output produced by the script's print() calls, for debugging.
  string script_output = 2;
}

message ListAdvisorCheckTestTargetsRequest {
  // Technology of the check to be tested; determines the eligible service type.
  AdvisorCheckTechnology technology = 1;
}

// AdvisorCheckTestTarget is a service an advisor check can be tested against.
message AdvisorCheckTestTarget {
  // ID of the eligible service.
  string service_id = 1;
  // Name of the eligible service.
  string service_name = 2;
}

message ListAdvisorCheckTestTargetsResponse {
  // Services a check of the requested technology can be tested against.
  repeated AdvisorCheckTestTarget targets = 1;
}

message ChangeAdvisorChecksRequest {
  repeated ChangeAdvisorCheckParams params = 1;
}

message ChangeAdvisorChecksResponse {}

message SendTestAdvisorNotificationRequest {
  // Addresses the sample report is emailed to.
  repeated string email_addresses = 1;
  // Severities the sample report includes findings for.
  repeated management.v1.Severity severities = 2;
}

message SendTestAdvisorNotificationResponse {}

// Insight represents a single persisted Advisor check run against a service.
message Insight {
  // Unique identifier of the history record.
  string id = 1;
  // ID of the run this result belongs to; all results produced by one execution share it.
  string run_id = 2;
  // Name of the check that ran.
  string check_name = 3;
  // Category the check belongs to.
  string category = 4;
  // Field 5 (interval) was removed when Advisor schedules replaced check intervals.
  reserved 5;
  reserved "interval";
  // ID of the monitored service on which the check ran.
  string service_id = 6;
  // Name of the monitored service on which the check ran.
  string service_name = 7;
  // Type of the monitored service on which the check ran.
  string service_type = 8;
  // ID of the node the service runs on.
  string node_id = 9;
  // Name of the node the service runs on.
  string node_name = 10;
  // Environment of the monitored service on which the check ran.
  string environment = 11;
  // Cluster of the monitored service on which the check ran.
  string cluster = 12;
  // Replication set of the monitored service on which the check ran.
  string replication_set = 13;
  // Outcome of the check run.
  AdvisorCheckResultStatus status = 14;
  // Short human-readable summary of the result.
  string summary = 15;
  // Long human-readable description of the result.
  string description = 16;
  // URL containing information on how to resolve a detected issue.
  string read_more_url = 17;
  // Output returned by the check run (finding details or execution error).
  string outcome = 18;
  // Severity of the result; unspecified while the check is pending or when it did not run.
  management.v1.Severity severity = 19;
  // Result labels.
  map<string, string> labels = 20;
  // Time when the check ran; unset while it is pending or when it did not run.
  google.protobuf.Timestamp checked_at = 21;
  // The actor that initiated the run.
  AdvisorCheckTriggeredBy triggered_by = 22;
  // Cloud region of the node the service runs on, empty when not applicable.
  string region = 23;
  // Cloud availability zone of the node the service runs on, empty when not applicable.
  string az = 24;
}

message ListInsightsRequest {
  // Maximum number of results per page.
  optional int32 page_size = 1 [(validate.rules).int32.gte = 1];
  // Index of the requested page, starts from 0.
  optional int32 page_index = 2 [(validate.rules).int32.gte = 0];
  // Filter by service ID.
  string service_id = 3;
  // Filter by outcome.
  optional AdvisorCheckResultStatus status = 4;
  // Return only results recorded at or after this time.
  google.protobuf.Timestamp from = 5;
  // Return only results recorded at or before this time.
  google.protobuf.Timestamp to = 6;
  // Filter by service name (partial, case-insensitive match).
  string service_name = 7;
  // Filter by node name (partial, case-insensitive match).
  string node_name = 8;
  // Filter by advisor category.
  string category = 9;
  // Filter by check name.
  string check_name = 10;
  // Filter by severity.
  optional management.v1.Severity severity = 11;
  // Filter by run ID.
  string run_id = 12;
  // Filter by the actor that initiated the run.
  optional AdvisorCheckTriggeredBy triggered_by = 13;
}

message ListInsightsResponse {
  // Total number of results.
  int32 total_items = 1;
  // Total number of pages.
  int32 total_pages = 2;
  // Insight records.
  repeated Insight results = 3;
}

message ListInsightsFilterValuesRequest {}

message ListInsightsFilterValuesResponse {
  // Distinct service names present in the check results history, sorted alphabetically.
  repeated string service_names = 1;
  // Distinct node names present in the check results history, sorted alphabetically.
  repeated string node_names = 2;
}

// AdvisorRunStatus is the state of an Advisor run.
enum AdvisorRunStatus {
  ADVISOR_RUN_STATUS_UNSPECIFIED = 0;
  // The run was requested and waits for the leader to start it.
  ADVISOR_RUN_STATUS_QUEUED = 1;
  // The run is executing checks.
  ADVISOR_RUN_STATUS_RUNNING = 2;
  // The run finished normally.
  ADVISOR_RUN_STATUS_COMPLETED = 3;
  // PMM restarted before the run finished; the insights it saved are kept.
  ADVISOR_RUN_STATUS_INTERRUPTED = 4;
  // The run stopped before running any check.
  ADVISOR_RUN_STATUS_ABORTED = 5;
}

// AdvisorRun is a single execution of Advisor checks. While it is running, its
// totals cover the checks executed so far.
message AdvisorRun {
  // ID shared by every insight the run produced.
  string id = 1;
  // The actor that initiated the run.
  AdvisorCheckTriggeredBy triggered_by = 2;
  // When the run began.
  google.protobuf.Timestamp started_at = 3;
  // When the run completed; unset while it is queued or running.
  google.protobuf.Timestamp finished_at = 4;
  // Number of distinct checks that passed or detected an issue on at least one service.
  int32 checks_count = 5;
  // Number of distinct services on which at least one check passed or detected an issue.
  int32 services_count = 6;
  // Number of findings, i.e. checks that detected an issue.
  int32 findings_count = 7;
  // Number of checks that could not be executed at all.
  int32 errors_count = 8;
  // Number of findings per severity, most severe first. A repeated field rather
  // than a map so severity stays a typed enum instead of a free-form key.
  repeated SeverityCount severity_counts = 9;
  // The state of the run.
  AdvisorRunStatus status = 10;
  // Number of distinct checks the run planned to execute; zero while it is queued.
  int32 planned_checks_count = 11;
  // Number of distinct services the run planned to cover; zero while it is queued.
  int32 planned_services_count = 12;
  // Names of the checks the run was narrowed to; empty means all.
  repeated string check_names = 13;
  // IDs of the services the run was narrowed to; empty means all.
  repeated string service_ids = 14;
  // Field 15 (intervals) was removed when Advisor schedules replaced check intervals.
  reserved 15;
  reserved "intervals";
  // ID of the schedule the run ran for, or was started from with RunAdvisorSchedule;
  // empty for other runs and once the schedule is deleted.
  string schedule_id = 16;
  // Name the schedule had when the run started; empty for runs not tied to a schedule.
  string schedule_name = 17;
  // When the schedule fell due; unset for runs a user started.
  google.protobuf.Timestamp scheduled_for = 18;
  // The run this scheduled run waited for; set only when it started more than a minute after falling due.
  AdvisorRunReference waited_for_run = 19;
}

// AdvisorRunReference identifies another Advisor run.
message AdvisorRunReference {
  // ID of the run.
  string run_id = 1;
  // The actor that initiated the run.
  AdvisorCheckTriggeredBy triggered_by = 2;
  // Name of the schedule the run belongs to; empty for runs not tied to a schedule.
  string schedule_name = 3;
  // When the run began.
  google.protobuf.Timestamp started_at = 4;
}

// SeverityCount is the number of findings a run produced at a single severity.
message SeverityCount {
  management.v1.Severity severity = 1;
  int32 count = 2;
}

message ListRunsRequest {
  // Maximum number of results per page.
  optional int32 page_size = 1 [(validate.rules).int32.gte = 1];
  // Index of the requested page, starts from 0.
  optional int32 page_index = 2 [(validate.rules).int32.gte = 0];
  // Filter by the actor that initiated the run.
  optional AdvisorCheckTriggeredBy triggered_by = 3;
  // Return only runs started at or after this time.
  google.protobuf.Timestamp from = 4;
  // Return only runs started at or before this time.
  google.protobuf.Timestamp to = 5;
  // Filter by run ID.
  string run_id = 6;
  // Filter by schedule ID.
  string schedule_id = 7;
}

message ListRunsResponse {
  // Total number of results.
  int32 total_items = 1;
  // Total number of pages.
  int32 total_pages = 2;
  // Runs, most recently started first.
  repeated AdvisorRun results = 3;
}

// AdvisorScheduleEmailMode selects who the runs of an Advisor schedule are emailed to.
enum AdvisorScheduleEmailMode {
  ADVISOR_SCHEDULE_EMAIL_MODE_UNSPECIFIED = 0;
  // Email the default recipients from the Advisor settings.
  ADVISOR_SCHEDULE_EMAIL_MODE_SETTINGS = 1;
  // Email the schedule's own recipients.
  ADVISOR_SCHEDULE_EMAIL_MODE_CUSTOM = 2;
  // Send no email.
  ADVISOR_SCHEDULE_EMAIL_MODE_OFF = 3;
}

// AdvisorSchedule runs Advisor checks on the given days at a time of day, both in UTC.
message AdvisorSchedule {
  // Unique identifier of the schedule.
  string schedule_id = 1;
  // Unique name, shown in Run history and in notification emails.
  string name = 2;
  // True if the schedule runs.
  bool enabled = 3;
  // Days the schedule runs on, in UTC: 0 is Sunday, 6 is Saturday.
  repeated int32 days_of_week = 4;
  // Time the schedule runs at, in UTC, as HH:MM.
  string time_of_day = 5;
  // Names of the checks to run; empty means all checks, including ones added later.
  repeated string check_names = 6;
  // IDs of the services to run the checks against; empty means all services, including ones added later.
  repeated string service_ids = 7;
  // Who the runs are emailed to.
  AdvisorScheduleEmailMode email_mode = 8;
  // Recipients of the CUSTOM email mode.
  repeated string email_addresses = 9;
  // Severities of the emailed findings, most severe first; empty means the default severities from the Advisor settings.
  repeated management.v1.Severity email_severities = 10;
  // When the schedule next runs; unset while it is disabled.
  google.protobuf.Timestamp next_run_at = 11;
  // The most recent run of the schedule, scheduled or started with RunAdvisorSchedule; unset if there is none.
  AdvisorRun last_run = 12;
  // When the schedule was created.
  google.protobuf.Timestamp created_at = 13;
  // When the schedule was last changed.
  google.protobuf.Timestamp updated_at = 14;
}

message ListAdvisorSchedulesRequest {}

message ListAdvisorSchedulesResponse {
  // Schedules ordered by time of day, then name.
  repeated AdvisorSchedule schedules = 1;
}

message CreateAdvisorScheduleRequest {
  // Unique name, case-insensitively.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  // True if the schedule runs; absent means true.
  optional bool enabled = 2;
  // Days the schedule runs on, in UTC: 0 is Sunday, 6 is Saturday.
  repeated int32 days_of_week = 3 [(validate.rules).repeated = {
    min_items: 1
    items: {
      int32: {
        gte: 0
        lte: 6
      }
    }
  }];
  // Time the schedule runs at, in UTC, as HH:MM.
  string time_of_day = 4 [(validate.rules).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  // Names of the checks to run; empty means all checks, including ones added later.
  repeated string check_names = 5;
  // IDs of the services to run the checks against; empty means all services, including ones added later.
  repeated string service_ids = 6;
  // Who the runs are emailed to.
  AdvisorScheduleEmailMode email_mode = 7 [(validate.rules).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Recipients of the CUSTOM email mode, at most 20; ignored in the other modes.
  repeated string email_addresses = 8;
  // Severities of the emailed findings; empty means the default severities from the Advisor settings. Ignored in the OFF mode.
  repeated management.v1.Severity email_severities = 9;
}

message CreateAdvisorScheduleResponse {
  AdvisorSchedule schedule = 1;
}

message UpdateAdvisorScheduleRequest {
  // ID of the schedule to replace.
  string schedule_id = 1 [(validate.rules).string.min_len = 1];
  // Unique name, case-insensitively.
  string name = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
  // True if the schedule runs; absent means true.
  optional bool enabled = 3;
  // Days the schedule runs on, in UTC: 0 is Sunday, 6 is Saturday.
  repeated int32 days_of_week = 4 [(validate.rules).repeated = {
    min_items: 1
    items: {
      int32: {
        gte: 0
        lte: 6
      }
    }
  }];
  // Time the schedule runs at, in UTC, as HH:MM.
  string time_of_day = 5 [(validate.rules).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  // Names of the checks to run; empty means all checks, including ones added later.
  repeated string check_names = 6;
  // IDs of the services to run the checks against; empty means all services, including ones added later.
  repeated string service_ids = 7;
  // Who the runs are emailed to.
  AdvisorScheduleEmailMode email_mode = 8 [(validate.rules).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Recipients of the CUSTOM email mode, at most 20; ignored in the other modes.
  repeated string email_addresses = 9;
  // Severities of the emailed findings; empty means the default severities from the Advisor settings. Ignored in the OFF mode.
  repeated management.v1.Severity email_severities = 10;
}

message UpdateAdvisorScheduleResponse {
  AdvisorSchedule schedule = 1;
}

message DeleteAdvisorScheduleRequest {
  // ID of the schedule to delete.
  string schedule_id = 1 [(validate.rules).string.min_len = 1];
}

message DeleteAdvisorScheduleResponse {}

message RunAdvisorScheduleRequest {
  // ID of the schedule to run.
  string schedule_id = 1 [(validate.rules).string.min_len = 1];
}

message RunAdvisorScheduleResponse {
  // ID assigned to this run.
  string run_id = 1;
}

message ListAdvisorServicesRequest {}

// AdvisorTargetService is a service Advisor checks can run against.
message AdvisorTargetService {
  // Unique identifier of the service.
  string service_id = 1;
  // Name of the service.
  string service_name = 2;
  // Technology of the checks that apply to the service.
  AdvisorCheckTechnology technology = 3;
  // Name of the node the service runs on.
  string node_name = 4;
  // Environment of the service.
  string environment = 5;
  // Cluster of the service.
  string cluster = 6;
}

message ListAdvisorServicesResponse {
  // MySQL, PostgreSQL and MongoDB services, ordered by name.
  repeated AdvisorTargetService services = 1;
}

message GetAdvisorNotificationSettingsRequest {}

// GetAdvisorNotificationSettingsResponse holds the Advisor notification settings, which are read-only here and changed with ChangeSettings.
message GetAdvisorNotificationSettingsResponse {
  // True if Advisor email notifications are enabled.
  bool enabled = 1;
  // Default recipients of the Advisor email reports.
  repeated string email_addresses = 2;
  // Default severities of the emailed findings, most severe first.
  repeated management.v1.Severity severities = 3;
}

// AdvisorService service provides public Management API methods for Advisor Service.
service AdvisorService {
  // ListRuns returns the history of Advisor check executions, most recent first.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {get: "/v1/advisors/runs"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Runs"
      description: "Returns the chronological history of Advisor check executions with their totals."
    };
  }
  // ListInsights returns the history of Advisor check results (insights).
  rpc ListInsights(ListInsightsRequest) returns (ListInsightsResponse) {
    option (google.api.http) = {get: "/v1/advisors/insights"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Insights"
      description: "Returns the history of Advisor check results (insights), including their outcomes."
    };
  }
  // ListInsightsFilterValues returns the distinct values usable as insights filters.
  rpc ListInsightsFilterValues(ListInsightsFilterValuesRequest) returns (ListInsightsFilterValuesResponse) {
    option (google.api.http) = {get: "/v1/advisors/insights:filterValues"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Insights Filter Values"
      description: "Returns the distinct service and node names present in the Advisor insights, for populating filter dropdowns."
    };
  }
  // StartAdvisorChecks executes Advisor checks and returns when all checks are executed.
  rpc StartAdvisorChecks(StartAdvisorChecksRequest) returns (StartAdvisorChecksResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks:start"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Start Advisor Checks"
      description: "Starts Advisor checks and returns the run ID without waiting for them to finish. All available checks are started if check names aren't specified. Only one run can be queued or running at a time; while another one is, the request fails with FAILED_PRECONDITION."
    };
  }
  // ListAdvisorChecks returns a list of advisor checks available to the user..
  rpc ListAdvisorChecks(ListAdvisorChecksRequest) returns (ListAdvisorChecksResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Checks"
      description: "List advisor checks available to the user, ordered by name."
    };
  }
  // ChangeAdvisorChecks enables/disables Advisor checks, globally or for specific services.
  rpc ChangeAdvisorChecks(ChangeAdvisorChecksRequest) returns (ChangeAdvisorChecksResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks:batchChange"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Change Advisor Checks"
      description: "Enables/disables advisor checks, globally or for specific services."
    };
  }
  // GetAdvisorCheck returns a single advisor check by name, including its queries and script.
  rpc GetAdvisorCheck(GetAdvisorCheckRequest) returns (GetAdvisorCheckResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks/{name}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Advisor Check"
      description: "Returns a single advisor check by name, including its queries and script."
    };
  }
  // CreateAdvisorCheck creates a new user-authored advisor check.
  rpc CreateAdvisorCheck(CreateAdvisorCheckRequest) returns (CreateAdvisorCheckResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Advisor Check"
      description: "Creates a new user-authored advisor check."
    };
  }
  // UpdateAdvisorCheck updates an existing user-authored advisor check.
  rpc UpdateAdvisorCheck(UpdateAdvisorCheckRequest) returns (UpdateAdvisorCheckResponse) {
    option (google.api.http) = {
      put: "/v1/advisors/checks/{name}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update Advisor Check"
      description: "Updates an existing user-authored advisor check, identified by the name in the path. Percona-shipped checks cannot be modified, and a check cannot be renamed."
    };
  }
  // TestAdvisorCheck executes an advisor check definition without saving it.
  rpc TestAdvisorCheck(TestAdvisorCheckRequest) returns (TestAdvisorCheckResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/checks:test"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Test Advisor Check"
      description: "Executes an advisor check definition against a single service without saving the check; results are returned and not persisted."
    };
  }
  // ListAdvisorCheckTestTargets returns the services an advisor check of the given technology can be tested against.
  rpc ListAdvisorCheckTestTargets(ListAdvisorCheckTestTargetsRequest) returns (ListAdvisorCheckTestTargetsResponse) {
    option (google.api.http) = {get: "/v1/advisors/checks:testTargets"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Check Test Targets"
      description: "Lists the services an advisor check of the given technology can be tested against."
    };
  }
  // DeleteAdvisorCheck deletes a user-authored advisor check.
  rpc DeleteAdvisorCheck(DeleteAdvisorCheckRequest) returns (DeleteAdvisorCheckResponse) {
    option (google.api.http) = {delete: "/v1/advisors/checks/{name}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete Advisor Check"
      description: "Deletes a user-authored advisor check. Percona-shipped checks cannot be deleted."
    };
  }
  // ListAdvisorSchedules returns the Advisor schedules.
  rpc ListAdvisorSchedules(ListAdvisorSchedulesRequest) returns (ListAdvisorSchedulesResponse) {
    option (google.api.http) = {get: "/v1/advisors/schedules"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Schedules"
      description: "Returns the Advisor schedules with their next and most recent runs."
    };
  }
  // CreateAdvisorSchedule creates an Advisor schedule.
  rpc CreateAdvisorSchedule(CreateAdvisorScheduleRequest) returns (CreateAdvisorScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/schedules"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Advisor Schedule"
      description: "Creates a schedule that runs Advisor checks on the given days at a time of day, both in UTC."
    };
  }
  // UpdateAdvisorSchedule replaces an Advisor schedule.
  rpc UpdateAdvisorSchedule(UpdateAdvisorScheduleRequest) returns (UpdateAdvisorScheduleResponse) {
    option (google.api.http) = {
      put: "/v1/advisors/schedules/{schedule_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Update Advisor Schedule"
      description: "Replaces the whole schedule identified by the ID in the path, so every field must be sent."
    };
  }
  // DeleteAdvisorSchedule deletes an Advisor schedule.
  rpc DeleteAdvisorSchedule(DeleteAdvisorScheduleRequest) returns (DeleteAdvisorScheduleResponse) {
    option (google.api.http) = {delete: "/v1/advisors/schedules/{schedule_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Delete Advisor Schedule"
      description: "Deletes an Advisor schedule. Its runs stay in the run history under the schedule's name."
    };
  }
  // RunAdvisorSchedule starts a run of an Advisor schedule now.
  rpc RunAdvisorSchedule(RunAdvisorScheduleRequest) returns (RunAdvisorScheduleResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/schedules/{schedule_id}:run"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Run Advisor Schedule"
      description: "Starts the schedule's checks against its services now, emailed as the schedule chooses, and returns the run ID. Only one run can be queued or running at a time; while another one is, the request fails with FAILED_PRECONDITION."
    };
  }
  // ListAdvisorServices returns the services Advisor checks can run against.
  rpc ListAdvisorServices(ListAdvisorServicesRequest) returns (ListAdvisorServicesResponse) {
    option (google.api.http) = {get: "/v1/advisors/services"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Advisor Services"
      description: "Returns the MySQL, PostgreSQL and MongoDB services Advisor checks can run against, ordered by name."
    };
  }
  // GetAdvisorNotificationSettings returns the Advisor notification settings.
  rpc GetAdvisorNotificationSettings(GetAdvisorNotificationSettingsRequest) returns (GetAdvisorNotificationSettingsResponse) {
    option (google.api.http) = {get: "/v1/advisors/notificationSettings"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Advisor Notification Settings"
      description: "Returns whether Advisor email notifications are enabled, and their default recipients and severities, which Advisor schedules can override. Read-only: ChangeSettings changes them."
    };
  }
  // SendTestAdvisorNotification emails a sample Advisor report to the given addresses.
  rpc SendTestAdvisorNotification(SendTestAdvisorNotificationRequest) returns (SendTestAdvisorNotificationResponse) {
    option (google.api.http) = {
      post: "/v1/advisors/notifications:test"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Send Test Advisor Notification"
      description: "Emails a sample Advisor report to the given addresses so that email delivery can be verified. It runs no checks and stores nothing."
    };
  }
}
