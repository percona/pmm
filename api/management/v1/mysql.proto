syntax = "proto3";

package management.v1;

import "common/common.proto";
import "extensions/v1/redact.proto";
import "google/protobuf/duration.proto";
import "inventory/v1/agents.proto";
import "inventory/v1/log_level.proto";
import "inventory/v1/services.proto";
import "management/v1/metrics.proto";
import "management/v1/node.proto";
import "validate/validate.proto";

// Add MySQL

message AddMySQLServiceParams {
  // Node identifier on which a service is been running.
  // Exactly one of these parameters should be present: node_id, node_name, add_node.
  string node_id = 1;
  // Node name on which a service is been running.
  // Exactly one of these parameters should be present: node_id, node_name, add_node.
  string node_name = 2;
  // Create a new Node with those parameters.
  // Exactly one of these parameters should be present: node_id, node_name, add_node.
  AddNodeParams add_node = 3;
  // Unique across all Services user-defined name. Required.
  string service_name = 4 [(validate.rules).string.min_len = 1];
  // Node and Service access address (DNS name or IP).
  // Address (and port) or socket is required.
  string address = 5;
  // Service Access port.
  // Port is required when the address present.
  uint32 port = 6;
  // Service Access socket.
  // Address (and port) or socket is required.
  string socket = 7;
  // The "pmm-agent" identifier which should run agents. Required.
  string pmm_agent_id = 8 [(validate.rules).string.min_len = 1];
  // Environment name.
  string environment = 9;
  // Cluster name.
  string cluster = 10;
  // Replication set name.
  string replication_set = 11;
  // MySQL username for scraping metrics.
  string username = 12 [
    (validate.rules).string.min_len = 1,
    (extensions.v1.sensitive) = REDACT_TYPE_FULL
  ];
  // MySQL password for scraping metrics.
  string password = 13 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // If true, adds qan-mysql-perfschema-agent for provided service.
  bool qan_mysql_perfschema = 14;
  // If true, adds qan-mysql-slowlog-agent for provided service.
  bool qan_mysql_slowlog = 15;
  // Custom user-assigned labels for Service.
  map<string, string> custom_labels = 16;
  // Skip connection check.
  bool skip_connection_check = 17;
  // Disable parsing comments from queries and showing them in QAN.
  bool disable_comments_parsing = 18;
  // Limit query length in QAN (default: server-defined; -1: no limit).
  int32 max_query_length = 19;
  // Disable query examples.
  bool disable_query_examples = 20;
  // If qan-mysql-slowlog-agent is added, slowlog file is rotated at this size if > 0.
  // If zero, server's default value is used.
  // Use negative value to disable rotation.
  int64 max_slowlog_file_size = 21;
  // Use TLS for database connections.
  bool tls = 22;
  // Skip TLS certificate and hostname validation.
  bool tls_skip_verify = 23;
  // Certificate Authority certificate chain.
  string tls_ca = 24;
  // Client certificate.
  string tls_cert = 25 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Password for decrypting tls_cert.
  string tls_key = 26 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Tablestats group collectors will be disabled if there are more than that number of tables.
  // If zero, server's default value is used.
  // Use negative value to disable them.
  int32 tablestats_group_table_limit = 27;
  // Defines metrics flow model for this exporter.
  // Metrics could be pushed to the server with vmagent,
  // pulled by the server, or the server could choose behavior automatically.
  MetricsMode metrics_mode = 28;
  // List of collector names to disable in this exporter.
  repeated string disable_collectors = 29;
  // Custom password for exporter endpoint /metrics.
  string agent_password = 30 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Exporter log level
  inventory.v1.LogLevel log_level = 31;
  // Optionally expose the exporter process on all public interfaces
  bool expose_exporter = 32;
  // extra DSN parameters to be used for connecting to MySQL.
  map<string, string> extra_dsn_params = 33;
  // Connection timeout for exporter (if set).
  google.protobuf.Duration connection_timeout = 34 [(validate.rules).duration = {
    gte: {seconds: 0}
  }];
}

// Update MySQL

// UpdateMySQLServiceParams holds the MySQL Service settings to change. Only the fields that are set are changed.
message UpdateMySQLServiceParams {
  // Node and Service access address (DNS name or IP). Replaces the socket.
  optional string address = 1;
  // Service Access port. Replaces the socket.
  optional uint32 port = 2 [(validate.rules).uint32.lt = 65536];
  // Service Access socket. Replaces the address and port.
  optional string socket = 3;
  // Environment name.
  optional string environment = 4;
  // Cluster name.
  optional string cluster = 5;
  // Replication set name.
  optional string replication_set = 6;
  // Replace all custom user-assigned labels for Service.
  common.StringMap custom_labels = 7;
  // MySQL username for scraping metrics.
  optional string username = 8 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // MySQL password for scraping metrics.
  optional string password = 9 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Custom password for exporter endpoint /metrics.
  optional string agent_password = 10 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Use TLS for database connections.
  optional bool tls = 11;
  // Skip TLS certificate and hostname validation.
  optional bool tls_skip_verify = 12;
  // Certificate Authority certificate chain.
  optional string tls_ca = 13;
  // Client certificate.
  optional string tls_cert = 14 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Password for decrypting tls_cert.
  optional string tls_key = 15 [(extensions.v1.sensitive) = REDACT_TYPE_FULL];
  // Replace all extra DSN parameters used for connecting to MySQL.
  common.StringMap extra_dsn_params = 16;
  // If true, ensures qan-mysql-perfschema-agent exists; if false, removes it.
  optional bool qan_mysql_perfschema = 17;
  // If true, ensures qan-mysql-slowlog-agent exists; if false, removes it.
  optional bool qan_mysql_slowlog = 18;
  // Disable parsing comments from queries and showing them in QAN.
  optional bool disable_comments_parsing = 19;
  // Limit query length in QAN (zero: server-defined; -1: no limit).
  optional int32 max_query_length = 20;
  // Disable query examples.
  optional bool disable_query_examples = 21;
  // Slowlog file is rotated at this size if > 0.
  // If zero, server's default value is used.
  // Use negative value to disable rotation.
  optional int64 max_slowlog_file_size = 22;
  // Tablestats group collectors will be disabled if there are more than that number of tables.
  // If zero, server's default value is used.
  // Use negative value to disable them.
  optional int32 tablestats_group_table_limit = 23;
  // Defines metrics flow model for this exporter.
  optional MetricsMode metrics_mode = 24;
  // Replace the list of collector names to disable in this exporter.
  common.StringArray disable_collectors = 25;
  // Log level for all Agents of the Service.
  optional inventory.v1.LogLevel log_level = 26;
  // Expose the exporter process on all public interfaces.
  optional bool expose_exporter = 27;
  // Connection timeout for exporter; zero restores the default.
  google.protobuf.Duration connection_timeout = 28 [(validate.rules).duration = {
    gte: {seconds: 0}
  }];
  // Skip connection check.
  bool skip_connection_check = 29;
}

message MySQLServiceResult {
  inventory.v1.MySQLService service = 1;
  inventory.v1.MySQLdExporter mysqld_exporter = 2;
  inventory.v1.QANMySQLPerfSchemaAgent qan_mysql_perfschema = 3;
  inventory.v1.QANMySQLSlowlogAgent qan_mysql_slowlog = 4;
  // Actual table count at the moment of adding.
  int32 table_count = 5;
}
