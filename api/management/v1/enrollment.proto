syntax = "proto3";

package management.v1;

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// EnrollmentToken authorizes enrolling a Node and nothing else. It lets an operator add
// hosts to monitoring without holding Grafana Org Admin, which registration otherwise
// requires. Only a hash of the token is stored, so the token itself is returned once, when
// it is created, and cannot be retrieved afterwards.
message EnrollmentToken {
  // Hash of the token. Identifies the token for listing and deletion; it is not the token.
  string token_hash = 1;
  // What the token is for, to make a list of them readable.
  string description = 2;
  // When the token stops working.
  google.protobuf.Timestamp expires_at = 3;
  // How many Nodes the token may enroll. Zero means unlimited.
  int32 max_uses = 4;
  // How many Nodes it has enrolled so far.
  int32 used_count = 5;
  // When the token was created.
  google.protobuf.Timestamp created_at = 6;
}

// CreateEnrollmentTokenRequest contains parameters for minting an enrollment token.
message CreateEnrollmentTokenRequest {
  // What the token is for. Required, so that a list of tokens is auditable.
  string description = 1 [(validate.rules).string.min_len = 1];
  // When the token stops working. Unset defaults to 30 minutes from now.
  google.protobuf.Timestamp expires_at = 2;
  // How many Nodes the token may enroll. Zero means unlimited.
  int32 max_uses = 3 [(validate.rules).int32.gte = 0];
}

// CreateEnrollmentTokenResponse contains the newly minted token.
message CreateEnrollmentTokenResponse {
  EnrollmentToken enrollment_token = 1;
  // The token itself. Returned only here, never stored and never logged.
  string token = 2;
}

// ListEnrollmentTokensRequest is a request to list enrollment tokens.
message ListEnrollmentTokensRequest {}

// ListEnrollmentTokensResponse contains every enrollment token, newest first.
message ListEnrollmentTokensResponse {
  repeated EnrollmentToken enrollment_tokens = 1;
}

// DeleteEnrollmentTokenRequest is a request to revoke an enrollment token.
message DeleteEnrollmentTokenRequest {
  // Hash of the token to revoke, as returned by listing.
  string token_hash = 1 [(validate.rules).string.min_len = 1];
}

// DeleteEnrollmentTokenResponse is empty.
message DeleteEnrollmentTokenResponse {}
