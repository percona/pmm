packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/plugins/*'

allowBuilds:
  '@swc/core': true
  esbuild: true
  protobufjs: true

# @grafana/ui pulls react-data-grid via a git ref; pnpm 11 blocks exotic subdeps by default.
blockExoticSubdeps: false

overrides:
  # Keep MUI core pinned to 7.3.7 (matches the yarn baseline). Floating ^7.3.7 to
  # 7.3.11 breaks @mui/x-date-pickers, which deep-imports @mui/utils/generateUtilityClass
  # (dropped from @mui/utils 7.3.11's exports map).
  '@mui/material': 7.3.7
  '@mui/system': 7.3.7
  '@mui/utils': 7.3.7
  '@mui/private-theming': 7.3.7
  '@mui/styled-engine': 7.3.7
  '@mui/icons-material': 7.3.7
  '@mui/core-downloads-tracker': 7.3.7
  esbuild: ~0.25.0
  cross-spawn: ~7.0.5
  brace-expansion: ~1.1.12
  nanoid: ~3.3.8
  '@remix-run/router': 1.23.2
  rollup: ^4.59.0
  react-router-dom: 6.30.2
  react-router: 6.30.2
  lodash: ^4.18.0
  immutable: ^5.1.5
  dompurify: ^3.2.7
  serialize-javascript: ^7.0.3
  picomatch: ^4.0.4
