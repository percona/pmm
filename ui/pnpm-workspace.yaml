packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: true

# @grafana/ui pulls react-data-grid via a git ref; pnpm 11 blocks exotic subdeps by default.
blockExoticSubdeps: false

# pmm-compat stays on React 18. The @grafana/* packages don't declare an @types/react
# peer, so their .d.ts resolve React types to apps/pmm's hoisted @types/react 19 →
# ReactNode mismatch (TS2786). Declaring the peer ties it to the consumer (pmm-compat,
# which provides @types/react 18).
packageExtensions:
  '@grafana/ui':
    peerDependencies:
      '@types/react': '*'
  '@grafana/data':
    peerDependencies:
      '@types/react': '*'
  '@grafana/runtime':
    peerDependencies:
      '@types/react': '*'
  '@grafana/schema':
    peerDependencies:
      '@types/react': '*'

overrides:
  # Keep MUI core pinned to 7.3.7 (matches the yarn baseline). Floating ^7.3.7 to
  # 7.3.11 breaks @mui/x-date-pickers, which deep-imports @mui/utils/generateUtilityClass
  # (dropped from @mui/utils 7.3.11's exports map).
  '@mui/material': 7.3.7
  '@mui/system': 7.3.7
  '@mui/utils': 7.3.7
  '@mui/private-theming': 7.3.7
  '@mui/styled-engine': 7.3.7
  '@mui/icons-material': 7.3.7
  '@mui/core-downloads-tracker': 7.3.7
  esbuild: ~0.25.0
  cross-spawn: ~7.0.5
  brace-expansion: ~1.1.12
  nanoid: ~3.3.8
  rollup: ^4.59.0
  lodash: ^4.18.0
  immutable: ^5.1.5
  dompurify: ^3.2.7
  serialize-javascript: ^7.0.3
  picomatch: ^4.0.4

minimumReleaseAgeExclude:
  - '@percona/peak-ui@1.0.25'
