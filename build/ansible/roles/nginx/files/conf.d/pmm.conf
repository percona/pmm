  upstream managed-grpc {
    server 127.0.0.1:7771;
    keepalive 32;
  }

  upstream managed-json {
    server 127.0.0.1:7772;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 75s;
  }

  upstream qan-api-grpc {
    server 127.0.0.1:9911;
    keepalive 32;
  }

  upstream qan-api-json {
    server 127.0.0.1:9922;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 75s;
  }

  upstream vmproxy {
    server 127.0.0.1:8430;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 75s;
  }

  upstream victoriametrics {
    server 127.0.0.1:9090;
    # Allocates a pool of idle TCP connections to the backend.
    # It's bigger than for the rest of upstreams because it has more incoming traffic to handle.
    keepalive 64;
    # Prevent connection churn during high-throughput metric shipping.
    # The NGINX default (100 or 1000) is insufficient for observability data streams.
    # Increasing this prevents frequent socket teardowns.
    keepalive_requests 100000;
    # Ensure connections survive standard 30s-60s scrape intervals
    keepalive_timeout 75s;
}

  upstream vmalert {
    server 127.0.0.1:8880;
    # Maintain a small pool of idle connections
    keepalive 32;
    # Keep connections alive across multiple scrapes/queries
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

  upstream nomad-server-json {
    server 127.0.0.1:4646;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 75s;
  }

  upstream grafana {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 75s;
  }

  # Sets up a 1MB memory zone named 'STATIC' and a max disk footprint of 1GB.
  # It is used for static assets caching.
  # Params:
  # levels=1:2 - Specifies a subtree of folders to store cache files in.
  # 1:2 means to create 1-character subdirectories and 2-character sub-subdirectories
  # (e.g. /srv/nginx/cache/c/29/4f...). This prevents filesystem performance degradation
  # due to thousands of files in a single folder.
  #
  # keys_zone=STATIC:1m - Allocates a 1 MB area in RAM called STATIC.
  # Only cache keys (MD5 hashes) and metadata are stored in RAM.
  # 1 MB holds ~8,000 keys.
  #
  # inactive=24h - If a cached file has not been accessed for 24 hours, NGINX deletes
  # it from disk, regardless of the time-to-live (TTL) specified in proxy_cache_valid.
  #
  # max_size=1g - Upper limit of disk space for cache (1 GB). When this limit is reached,
  # the cache manager process deletes the least used data (LRU algorithm).
  proxy_cache_path /srv/nginx/cache/static levels=1:2 keys_zone=STATIC:1m inactive=24h max_size=1g;

  # Sets up a 1MB memory zone named 'AUTH_CACHE' and a max disk footprint of 10M.
  # It is used for auth response caching to 'push metrics' URI.
  proxy_cache_path /srv/nginx/cache/auth levels=1:2 keys_zone=AUTH_CACHE:1m inactive=10m max_size=128m;

  server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    absolute_redirect off;

    # Low Latency: Accelerates the transfer of small amounts of data -
    # REST/JSON API, gRPC, headers or WebSocket frames.
    # Keep-Alive Optimization: Improves responsiveness when using reopened TCP connections.
     tcp_nodelay on;

    # allow huge requests
    large_client_header_buffers 128 64k;

    client_max_body_size 10m;

    ssl_certificate /srv/nginx/certificate.crt;
    ssl_certificate_key /srv/nginx/certificate.key;
    ssl_trusted_certificate /srv/nginx/ca-certs.pem;
    ssl_dhparam /srv/nginx/dhparam.pem;

    # Enable passing of the remote user's IP address to all
    # proxied services using the X-Forwarded-For header
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    ###############  MAINTENANCE BLOCK  ###################
    # this block checks for maintenance.html file and, if it exists, it redirects all requests to the maintenance page
    # there are two exceptions for it /v1/updates/Status and /auth_request endpoints
    set $maintenance_mode 0;

    if (-f /usr/share/pmm-server/maintenance/maintenance.html) {
      set $maintenance_mode 1;
    }

    if ($request_uri ~* "^/v1/updates/Status|^/auth_request") {
      set $maintenance_mode 0;
    }

    if ($maintenance_mode = 1) {
      return 503;
    }

    error_page 503 @maintenance;

    location @maintenance {
      auth_request off;
      root /usr/share/pmm-server/maintenance;
      rewrite ^(.*)$ /maintenance.html break;
    }

    ###############  AUTHENTICATION BLOCK  #################

    # Enable auth_request for all locations, including root
    # (but excluding /auth_request_no_cache).
    auth_request /auth_request_no_cache;

    # Extract custom headers sent by the auth backend
    # (e.g., X-Auth-Code, X-Auth-Error, X-Auth-Message).
    # These headers are set by auth backend in case authentication failure (401, 403 status codes).
    auth_request_set $auth_code $upstream_http_x_auth_code;
    auth_request_set $auth_error $upstream_http_x_auth_error;
    auth_request_set $auth_message $upstream_http_x_auth_message;

    # Store the value of X-Proxy-Filter header of auth_request subrequest response in the variable.
    auth_request_set $auth_request_proxy_filter $upstream_http_x_proxy_filter;
    proxy_set_header X-Proxy-Filter $auth_request_proxy_filter;

    # 401 is handled by @auth_failed (below) to produce a response body.
    # It construct JSON body based on values extracted from auth response headers
    # (see above `auth_request_set $auth_code $upstream_http_x_auth_code;`)
    # 403 (insufficient role) is served as static body by @access_denied.

    error_page 401 = @auth_failed;
    error_page 403 = @access_denied;

    # Internal location for authentication via pmm-managed/Grafana.
    # It doesn't use cache for request authentication results - a subrequest will be sent
    # to auth backend for authentication for each incoming request that requies authentication.
    location = /auth_request_no_cache {
      internal;
      auth_request off;
      proxy_pass http://managed-json/auth_request;
      # nginx always strips body from authentication subrequests.
      # Overwrite Content-Length to avoid problems on Go side and to keep connection alive.
      proxy_pass_request_body off;
      proxy_set_header Content-Length 0;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # Those headers are set for both subrequest and normal request.
      proxy_set_header X-Original-Uri $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_buffering off;
    }

    # Internal location for authentication via pmm-managed/Grafana.
    # It uses cache for request authentication results. It incoming request matches the
    # Cache entry key - cached response will be used immidiatly (if it exists), otherwise
    # a subrequest to auth backend is sent and it's response is cached.
    location = /auth_request_cached {
      internal;
      auth_request off;
      proxy_pass http://managed-json/auth_request;
      # nginx always strips body from authentication subrequests.
      # Overwrite Content-Length to avoid problems on Go side and to keep connection alive.
      proxy_pass_request_body off;
      proxy_set_header Content-Length 0;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # Those headers are set for both subrequest and normal request.
      proxy_set_header X-Original-Uri $request_uri;
      proxy_set_header X-Original-Method $request_method;
      proxy_buffering on;

      # Auth responses cache set up.
      proxy_cache AUTH_CACHE;
      # If the client request method is listed in this directive then the response will be cached.
      # “GET” and “HEAD” methods are always added to the list,
      # though it is recommended to specify them explicitly.
      proxy_cache_methods GET HEAD POST;
      # Cache entry key = bearer/basic auth header|original request method|original request URL path.
      # Same pair reuses one cached auth result.
      proxy_cache_key "$http_authorization|$request_method|$request_uri";
      # Successful auth responses are cached for 5 minutes.
      proxy_cache_valid 200 5m;
      # Denied auth responses are cached for 30 seconds
      # (negative caching to reduce auth backend load).
      proxy_cache_valid 401 403 30s;
      # NGINX ignores upstream cache-control and cookie instructions,
      # forcing cache behavior from local config.
      # NOTE: our pmm-managed doesn't set any of those headers,
      # but this is a good practice to have it here.
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
    }

    location @auth_failed {
      auth_request off;
      default_type application/json;

      # Construct JSON payload using the extracted variables
      return 401 '{"code": $auth_code, "error": "$auth_error", "message": "$auth_message"}';
    }

    # Static body matching pmm-managed's PermissionDenied response (see error_page 403 above).
    location @access_denied {
      auth_request off;
      default_type application/json;
      return 403 '{"code":7,"error":"Access denied","message":"Access denied"}';
    }

    ###############  PMM UI BLOCK  ########################

    # PMM UI
    rewrite ^/pmm-ui$ /pmm-ui/;
    location ^~ /pmm-ui/ {
      # Will redirect on FE to login page if user is not authenticated
      auth_request off;

      alias /usr/share/pmm-ui/;
      try_files $uri /index.html break;

      # Optimizations for local static file serving
      # Bypass user-space buffers, copy directly between file descriptors
      sendfile on;
      # Send HTTP response headers in the same packet as the file data
      tcp_nopush on;
      # Disable Nagle's algorithm for faster small packet delivery
      tcp_nodelay on;
    }

    # All PMM UI assets are dynamic - bypass authentication and cache on browser side.
    location ^~ /pmm-ui/assets/ {
      auth_request off;

      alias /usr/share/pmm-ui/assets/;
      try_files $uri =404;
      # Add caching headers to further reduce container load
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable" always;

      add_header X-Cache-Status "LOCAL-FILE" always;

      # open_file_cache stores file metadata in RAM, rather than their contents.
      # This significantly reduces the number of open(), stat(), and close() system calls
      # in the operating system when distributing static files, which reduces the load
      # on the CPU and disk subsystem.
      #
      # Params:
      # max=10000 - The maximum number of items (handles) in the cache. When the cache fills up,
      # NGINX removes the least used items using the LRU (Least Recently Used) algorithm.
      # inactive=60s - The amount of time an item remains in the cache if it has not been accessed.
      # After this time, the item is removed (default 60s).
      open_file_cache max=10000 inactive=60s;
      # The time interval after which NGINX will check at the OS level whether the file
      # has changed and whether it still exists (default 60s).
      open_file_cache_valid 60s;
      # The minimum number of file requests during the inactive time required to keep
      # the handle open in the cache (default 1).
      open_file_cache_min_uses 2;
      # Enables or disables caching of file search error information
      # (allows to avoid constant disk requests for files that do not exist).
      open_file_cache_errors on;

      # Optimizations for local static file serving.
      # Bypass user-space buffers, copy directly between file descriptors
      sendfile on;
      # Send HTTP response headers in the same packet as the file data
      tcp_nopush on;
      # Disable Nagle's algorithm for faster small packet delivery
      tcp_nodelay on;
    }

    # Grafana
    location = / {
      auth_request off;
      return 302 /graph/;
    }

    rewrite ^/graph$ /graph/;
    location ^~ /graph/ {
      proxy_cookie_path / "/;";
      proxy_pass http://grafana;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 600;
      proxy_set_header Host $http_host;
      proxy_set_header X-Proxy-Filter $auth_request_proxy_filter;
    }

    # Grafana Static Assets - shall bypass authentication.
    location ^~ /graph/public/ {
      auth_request off;
      proxy_pass http://grafana;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 600;
      proxy_set_header Host $http_host;
      # Add caching headers to further reduce container load
      expires 30d;
      add_header Cache-Control "public, no-transform";

      # Enable caching using the 'STATIC' zone.
      proxy_cache STATIC;
      # Cache successful responses for 24 hours
      proxy_cache_valid 200 24h;
      # Add a header to debug cache HITs or MISSes.
      add_header X-Cache-Status $upstream_cache_status;

      # Optimizations for local static file serving
      # Bypass user-space buffers, copy directly between file descriptors
      sendfile on;
      # Send HTTP response headers in the same packet as the file data
      tcp_nopush on;
      # Disable Nagle's algorithm for faster small packet delivery
      tcp_nodelay on;
    }

    # See https://grafana.com/tutorials/run-grafana-behind-a-proxy/
    location ^~ /graph/api/live/ {
      proxy_http_version 1.1;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Host $http_host;
      proxy_pass http://grafana;
    }

    # Must be a bug in grafana, revert once it's fixed
    location = /dashboard/snapshots {
      return 301 /graph/dashboard/snapshots;
    }    

    ###############  METRICS AND ALERTS BLOCK  ##############

    location ^~ /prometheus {
      proxy_pass http://victoriametrics;
      proxy_read_timeout 600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # Disable body size limits for large remote_write payloads
      client_max_body_size 0;
      client_body_buffer_size 10m;
    }

    location ^~ /prometheus/api/v1 {
      proxy_pass http://vmproxy;
      proxy_read_timeout 600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
    
    # VictoriaMetrics
    location ^~ /victoriametrics/ {
      proxy_pass http://vmproxy/;
      proxy_read_timeout 600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      client_body_buffer_size 10m;
      proxy_buffering off;
    }

    # This URI is used by vm-agent to push metrics.
    # This is most heavily used URI and it requires auth cache usage to decrease the
    # load on auch backend.
    location = /victoriametrics/api/v1/write {
      auth_request /auth_request_cached;
      proxy_pass http://victoriametrics/prometheus/api/v1/write;
      proxy_read_timeout 600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      client_body_buffer_size 10m;
      proxy_buffering off;
    }

    # VMAlert
    location ^~ /prometheus/rules {
      proxy_pass http://vmalert/api/v1/rules;
      proxy_read_timeout 600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }
    location ^~ /prometheus/alerts {
      proxy_pass http://vmalert/api/v1/alerts;
      proxy_read_timeout 600;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    ###############  NOMAD BLOCK  ########################
    location ^~ /nomad/ {
      rewrite /nomad/(.*) /$1 break;
      proxy_pass https://nomad-server-json;

      # Nomad blocking queries will remain open for a default of 5 minutes.
      # Increase the proxy timeout to accommodate this timeout with an
      # additional grace period.
      proxy_read_timeout 319s;

      # Nomad log streaming uses streaming HTTP requests. In order to
      # synchronously stream logs from Nomad to NGINX to the browser
      # proxy buffering needs to be turned off.
      proxy_buffering off;

      # The default Origin header will be the proxy address, which
      # will be rejected by Nomad. It must be rewritten to be the
      # host address instead.
      proxy_set_header Origin "${scheme}://${proxy_host}";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    ###############  SWAGGER BLOCK  ######################
    # Swagger UI
    rewrite ^/swagger/swagger.json$ /swagger.json permanent;
    rewrite ^/swagger/(.*)$ /swagger permanent;
    location ^~ /swagger {
      root /usr/share/pmm-managed/swagger;
      try_files $uri /index.html =404;
    }

    ###############  API BLOCK   ##########################
    # pmm-managed gRPC APIs
    location ^~ /agent. {
      grpc_pass grpc://managed-grpc;
      # Disable request body size check for gRPC streaming, see https://trac.nginx.org/nginx/ticket/1642.
      # pmm-managed uses grpc.MaxRecvMsgSize for that.
      client_max_body_size 0;
    }
    location ^~ /inventory. {
      grpc_pass grpc://managed-grpc;
    }
    location ^~ /management. {
      grpc_pass grpc://managed-grpc;
    }
    location ^~ /server. {
      grpc_pass grpc://managed-grpc;
    }
    location ^~ /realtimeanalytics. {
      grpc_pass grpc://managed-grpc;
      # Disable request body size check for gRPC streaming, see https://trac.nginx.org/nginx/ticket/1642.
      # pmm-managed uses grpc.MaxRecvMsgSize for that.
      client_max_body_size 0;
    }

    # pmm-managed JSON APIs
    location /v1/ {
      proxy_pass http://managed-json/v1/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    # qan-api gRPC APIs should not be exposed

    # qan-api JSON APIs
    location ^~ /v1/qan {
      proxy_pass http://qan-api-json/v1/qan;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Proxy-Filter $auth_request_proxy_filter;
      proxy_buffering off;
    }

    # compatibility with PMM 2.x
    rewrite ^/v1/version$ /v1/server/version;

    rewrite ^/logs.zip$ /v1/server/logs.zip;
    # logs.zip in both PMM 1.x and 2.x variants
    location = /v1/server/logs.zip {
      proxy_pass http://managed-json;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

    ###############  FS BLOCK  ###########################
    # pmm-dump artifacts
    location ^~ /dump/ {
      alias /srv/dump/;
      try_files $uri =404;

      # Optimizations for local static file serving
      # Bypass user-space buffers, copy directly between file descriptors
      sendfile on;
      # Send HTTP response headers in the same packet as the file data
      tcp_nopush on;
      # Disable Nagle's algorithm for faster small packet delivery
      tcp_nodelay on;
    }

    ############  UNPROTECTED ENDPOINTS BLOCK  ##############
    # Must be available without authentication for health checking

    # compatibility with PMM 1.x
    rewrite ^/ping$ /v1/server/readyz;
    # compatibility with PMM 2.x
    rewrite ^/v1/readyz$ /v1/server/readyz;

    # Unprotected Health Checks and Version Info
    location ~ ^/v1/server/(readyz|leaderHealthCheck)$ {
      # Matches /v1/server/readyz, /v1/server/leaderHealthCheck
      auth_request off;
      proxy_pass http://managed-json;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
    }

  }
