---
- name: Create required directories for Nginx
  file:
    path: "{{ item }}"
    state: directory
    owner: pmm
    group: root
    mode: 0775
  loop:
    - /usr/share/pmm-server/static/
    - /srv/tmp/client/
    - /srv/tmp/proxy/
    - /srv/tmp/fastcgi/
    - /srv/tmp/uwsgi/
    - /srv/tmp/scgi/
    - /etc/nginx/conf.d/
    - /etc/nginx/extensions.d/
    - /etc/nginx/ssl/

- name: Add nginx.org stable repository
  yum_repository:
    name: nginx-stable
    description: nginx.org - Stable Repository
    baseurl: https://nginx.org/packages/rhel/9/$basearch/
    gpgkey: https://nginx.org/keys/nginx_signing.key
    gpgcheck: yes
    module_hotfixes: yes
    enabled: no

- name: Install nginx
  dnf:
    name: nginx-{{ nginx_version }}
    state: installed
    enablerepo: nginx-stable
    exclude:
      - logrotate-*

# The package ships a port 80 server in conf.d, which nginx.conf includes.
- name: Remove the default server shipped with the package
  file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Add ssl-related files and scripts
  copy:
    src: "ssl/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: ca-certs.pem, dest: /etc/nginx/ssl/ca-certs.pem, mode: "0644" }
    - { src: certificate.conf, dest: /etc/nginx/ssl/certificate.conf, mode: "0644" }
    - { src: dhparam.pem, dest: /etc/nginx/ssl/dhparam.pem, mode: "0644" }
    - { src: generate-ssl-certificate, dest: /var/lib/cloud/scripts/per-boot/generate-ssl-certificate, mode: "0755" }
    - { src: upgrade-certificate, dest: /var/lib/cloud/scripts/per-boot/upgrade-certificate, mode: "0755" }

- name: Copy nginx configs
  copy:
    src: "{{ item }}"
    dest: "/etc/nginx/{{ item }}"
    mode: 0644
  loop:
    - "nginx.conf"
    - "conf.d/pmm-ssl.conf"
    - "conf.d/pmm.conf"

- name: Find the default nginx config files
  find:
    paths: /etc/nginx
    patterns: "*.default"
  register: default_config

- name: Remove the default nginx config files
  file:
    path: "{{ item }}"
    state: absent
  loop: "{{ default_config.files | map(attribute='path') | list }}"
  when: default_config.files | length > 0

- name: Change ownership of nginx dirs
  file:
    path: "{{ item }}"
    state: directory
    group: root
    owner: pmm
    recurse: yes
  loop:
    - /etc/nginx
    - /srv/nginx

- name: Provision Nginx files
  file:
    path: "{{ item }}"
    state: touch
    group: root
    owner: pmm
    mode: 0660
  loop:
    - /run/nginx.pid
    - /srv/logs/nginx.log

- name: Copy local-rss.xml file
  copy:
    src: local-rss.xml
    dest: /usr/share/pmm-server/static/
    group: root
    owner: pmm
    mode: 0644
