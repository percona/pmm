---
- name: Create grafana directory
  file:
    path: "{{ item }}"
    state: directory
    owner: pmm
    group: root
    mode: 0755
  loop:
    - /srv/grafana
    - /srv/grafana/plugins

- name: Set ownership on /etc/grafana
  file:
    path: /etc/grafana
    state: directory
    owner: pmm
    group: root
    mode: 0755
    recurse: true

- name: Copy a custom version of grafana.ini
  copy:
    src: grafana.ini
    dest: /etc/grafana/grafana.ini
    owner: pmm
    group: root

- name: Create provisioning directory
  file:
    path: "/usr/share/grafana/conf/provisioning/{{ item }}"
    owner: pmm
    group: root
    state: directory
  loop:
    - datasources
    - plugins
    - dashboards

- name: Copy grafana provisioning files
  copy:
    src: "{{ item }}.yml"
    dest: "/usr/share/grafana/conf/provisioning/{{ item }}/default.yml"
    owner: pmm
    group: root
  loop:
    - datasources
    - plugins
    - dashboards

# pmm-managed renders the built-in alert rules into /srv/grafana/provisioning/alerting at runtime
# and creates that directory itself, because /srv is emptied at the end of the image build and
# repopulated by the entrypoint. Only the link has to be baked in. A link with no target yet is
# fine: Grafana logs that it cannot read the directory and carries on.
# Grafana's own package ships an empty alerting/ directory here, and ansible refuses to convert a
# directory into a symlink even with force, so it has to go first.
- name: Remove Grafana's stock alerting provisioning directory
  file:
    path: /usr/share/grafana/conf/provisioning/alerting
    state: absent

- name: Link Grafana's alerting provisioning directory to /srv
  file:
    src: /srv/grafana/provisioning/alerting
    dest: /usr/share/grafana/conf/provisioning/alerting
    owner: pmm
    group: root
    state: link
    force: true
    follow: false

- name: Copy change-admin-password command
  copy:
    src: change-admin-password
    dest: /usr/local/sbin/change-admin-password
    mode: 0755
