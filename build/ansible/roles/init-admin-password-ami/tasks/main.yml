- name: Fetch instance metadata
  uri:
    url: http://169.254.169.254/latest/meta-data/instance-id
    return_content: yes
  register: jsondata

- debug: msg="Instance ID {{ jsondata['content'] }}"

- name: change admin password
  command: change-admin-password {{ jsondata['content'] }}
  # Instance IDs have no uppercase letter, so they fail Grafana's password policy.
  environment:
    GF_AUTH_BASIC_PASSWORD_POLICY: "false"
