---
services:
  pmm-server:
    profiles:
      - pmm
    image: '${PMM_SERVER_IMAGE:?Fatal: .env file is not provided}'
    platform: linux/amd64
    container_name: pmm-server
    hostname: pmm-server
    env_file:
      - .env
    # enable for delve
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

    # see https://github.com/golang/go/wiki/LinuxKernelSignalVectorBug#what-to-do
    ulimits:
      memlock: 67108864

    ports:
      - ${PMM_PORT_HTTPS:-443}:8443
      # For headless delve
      - ${PMM_PORT_DELVE:-2345}:2345
      # PG
      - ${PMM_PORT_PG:-5432}:5432
      # VM
      - ${PMM_PORT_VM:-9090}:9090
      # CH
      - ${PMM_PORT_CH_TCP:-9000}:9000
      - ${PMM_PORT_CH_HTTP:-8123}:8123
      # Vite HMR
      - ${PMM_PORT_VITE:-5173}:5173
      # pmm-compat plugin livereload
      - 35729:35729
      # QAN UI livereload
      - 35730:35730
    volumes:
      - ./:/root/go/src/github.com/percona/pmm
      - ./.devcontainer/Makefile:/root/go/src/github.com/percona/pmm/Makefile:ro
      # clickhouse config for backup/restore
      - ./dev/clickhouse-config.xml:/etc/clickhouse-server/config.xml:ro
      # caching
      - node-modules:/root/go/src/github.com/percona/pmm/ui/node_modules
      - go-modules:/root/go/pkg/mod
      - go-cache:/root/.cache
      - pmm-data:/srv
      # No separate pmm-sep volume here, unlike docker-compose.yml: this
      # entrypoint runs entirely as uid 1000 from the start (see "Running as
      # UID 1000" in its very first log line), so it can never chown a fresh,
      # root-owned named volume the way the production image's root-then-drop
      # entrypoint can - sep-secrets' own ownership check FATALs on it. A
      # plain subdirectory of the already-1000-owned pmm-data volume avoids
      # that; isolating it from the rest of /srv does not matter here anyway,
      # since this dev-loop runs SEP natively and never mounts anything from
      # PMM's /srv into it.
      # custom advisor files
      - ./managed/data/advisors/:/usr/local/percona/advisors/
      - ./managed/data/checks/:/usr/local/percona/checks/
      - ./managed/data/alerting-templates/:/usr/local/percona/alerting-templates/
      # nginx config overrides
      - ./build/ansible/roles/nginx/files/conf.d/pmm.conf:/etc/nginx/conf.d/pmm.conf:ro
      # PMM-15316's sep-secrets helper: this devcontainer's base image predates
      # the still-unmerged PMM-15205-sep-fb line that added the sep ansible
      # role entirely, so /opt/ansible/roles/sep does not exist in it - without
      # this mount, entrypoint.sh's unconditional `bash
      # /opt/ansible/roles/sep/files/sep-secrets` call (gated on PMM_ENABLE_SEP,
      # which ./om env always sets) fails the container outright with "No such
      # file or directory". Remove once a devcontainer image built after that
      # PR merges is in use.
      - ./build/ansible/roles/sep:/opt/ansible/roles/sep:ro
      # peak-ui: mount your local checkout, then use file: protocol to reference it from the package.json
      # - ../peak-ui:/root/go/src/github.com/percona/peak-ui
      # grafana
      # - ../grafana:/root/go/src/github.com/percona/grafana
      # - ../grafana/public:/usr/share/grafana/public

  mail-server:
    profiles:
      - mail-server
    image: axllent/mailpit
    container_name: mail-server
    hostname: mail-server
    ports:
      - ${PMM_PORT_MAIL_SERVER_UI:-8025}:8025 # Web UI - http://localhost:8025

  renderer:
    profiles:
      - renderer
    image: grafana/grafana-image-renderer:latest
    environment:
      - RENDERING_VERBOSE_LOGGING=true
      - RENDERING_DUMPIO=true
      - IGNORE_HTTPS_ERRORS=true
      - LOG_LEVEL=debug
    ports:
      - ${PMM_PORT_RENDERER:-8081}:8081

volumes:
  go-modules:
    name: go-modules
  go-cache:
    name: go-cache
  pmm-data:
    name: pmm-data
  node-modules:
    name: node-modules
