---
templates:
  - name: pmm_mysql_replication_sql_running
    version: 1
    summary: MySQL replication running SQL
    expr: |-
      # One series per channel: 1 = the SQL thread of this channel is not running, 0 = running.
      # Only on replicas that have connected to a source; Group Replication channels are excluded.
      (mysql_slave_status_replica_sql_running{channel_name!~"group_replication_(applier|recovery)"} == bool 0 and ON (instance) mysql_slave_status_source_server_id > 0) or
      (mysql_slave_status_slave_sql_running{channel_name!~"group_replication_(applier|recovery)"} == bool 0 and ON (instance) mysql_slave_status_master_server_id > 0)
    for: 1m
    severity: critical
    annotations:
      description: |-
        MySQL replication SQL thread not running on {{ $labels.service_name }}
        Channel: {{ with $labels.channel_name }}{{ . }}{{ else }}{{ with $labels.connection_name }}{{ . }}{{ else }}(default){{ end }}{{ end }}
        VALUE = {{ $value }}
      summary: MySQL replication SQL thread not running ({{ $labels.service_name }}, channel {{ with $labels.channel_name }}{{ . }}{{ else }}{{ with $labels.connection_name }}{{ . }}{{ else }}(default){{ end }}{{ end }})
