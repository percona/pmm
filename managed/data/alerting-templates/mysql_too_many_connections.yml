---
templates:
  - name: pmm_mysql_too_many_connections
    version: 1
    summary: MySQL connections in use
    queries:
      - ref_id: A
        expr: |-
          max_over_time(mysql_global_status_threads_connected[5m]) / ignoring (job)
          mysql_global_variables_max_connections
          * 100
    expressions:
      - ref_id: C
        type: math
        expression: "$A > [[ .threshold ]]"
    condition: C
    params:
      - name: threshold
        summary: A percentage from configured maximum
        unit: "%"
        type: float
        range: [0, 100]
        value: 80
    for: 5m
    severity: warning
    annotations:
      summary: MySQL too many connections ({{ $labels.service_name }})
      description: |-
        {{ printf "%.0f" $values.A.Value }}% of connections (more than [[ .threshold ]]%) are used
        by {{ $labels.service_name }} on {{ $labels.node_name }}.
