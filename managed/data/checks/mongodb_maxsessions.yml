---
checks:
  - version: 2
    name: mongodb_maxsessions
    summary: MongoDB maxSessions
    description: This check returns warnings if MongoDB is using more maxSessions value other than the default one 1000000 2
    technology: MONGODB
    category: Connections
    # author: Vinodh Krishnaswamy/Parag Bhayani
    queries:
      - type: MONGODB_GETCMDLINEOPTS
    script: |
      read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"

      def check_context(docs, context):
          """
          This check returns warnings if MongoDB using more than 1000000 maxSessions value 2.
          """

          info = docs[0]
          results = []

          for row in info:
              setParameter = row["parsed"].get("setParameter", {})
              if not setParameter or "maxSessions" not in setParameter:
                  continue

              maxSV = int(float(str(setParameter["maxSessions"])))
              if maxSV > 1000000:
                  results.append({
                      "summary": "MongoDB is using maxSessions - {}, which is more than the default value - 1000000".format(maxSV),
                      "description": "To avoid performance issues, see the following blog to check & set the right value for your environment",
                      "read_more_url": read_url.format("mongodb-maxSessions"),
                      "severity": "warning",
                  })

          return results
