---
checks:
  - version: 2
    name: mysql_automatic_expired_password
    summary: MySQL Automatic User Expired Password
    description: Warn about MySQL parameter automatic password expiry being inactive.
    technology: MYSQL
    category: Security
    interval: standard
    queries:
      - type: MYSQL_SHOW
        query: VARIABLES
    script: |
      def check_context(rows, context):
          """
          This check returns a warning if automatic password expiry is inactive.
          """

          summary = ""
          description = ""
          action = "activate"

          rows = rows[0]
          for row in rows:
              name, value = row["Variable_name"], row["Value"]
              if name == "default_password_lifetime":
                  print(name, "=", value)
                  if value == "0":
                      summary = "Automatic password expiry is inactive"
                  elif value >= "365":
                      summary = "Default password lifetime is too long"
                      description = "The default password lifetime is set to {} days. ".format(value)
                      action = "change"

              if name == "disconnect_on_expired_password" and summary:
                  print(name, "=", value)
                  if value == "ON":
                      description += "System variable disconnect_on_expired_password is enabled. The server will not allow connecting clients with expired passwords. "
                  else:
                      description += "System variable disconnect_on_expired_password is disabled. The server permits the client to connect but puts it in sandbox mode. "

          if summary:
              return [{
                  "summary": summary,
                  "description": "{}. {}See the following steps to {}.".format(summary, description, action),
                  "read_more_url": "https://dev.mysql.com/doc/refman/8.0/en/password-management.html#password-expiration-policy",
                  "severity": "warning"
              }]

          return []
