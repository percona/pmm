---
checks:
  - version: 2
    name: mysql_test_database
    summary: MySQL test Database
    description: Identifies databases with name 'test' or 'test_%'
    family: MYSQL
    category: Configuration
    subcategory: Generic
    interval: standard
    queries:
      - type: MYSQL_SHOW
        query: "DATABASES WHERE `Database` = 'test' or `Database` like 'test_%'"
    script: |
      def check_context(docs, context):
          """
          This check identifies databases with name 'test' or 'test_%'.
          """

          dbs = []

          rows = docs[0]
          for row in rows:
              db = row.get("Database")
              dbs.append(db)

          if dbs:
              return [{
                  "summary": "Test database(s) detected: {}".format(", ".join(dbs)),
                  "description": "Improve MySQL Installation Security by running mysql_secure_installation",
                  "severity": "info"
          }]

          return []
