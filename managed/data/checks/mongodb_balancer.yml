---
checks:
  - version: 2
    name: mongodb_balancer
    summary: MongoDB Balancer is disabled
    description: This check warns if the balancer process is disabled
    interval: standard
    technology: MONGODB
    category: Performance
    subcategory: Replication
    # author: Parag bhayani
    queries:
      - type: METRICS_INSTANT
        query: avg by(cluster) (mongodb_mongos_sharding_chunks_is_balancer_running{node_name=~"{{.NodeName}}"})
    script: |
      read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"

      def check_context(docs, context):
          results = []

          clusters = []
          for row in docs[0]:
              cluster = row["metric"]["cluster"]
              chunk_balance = int(row["value"][1])
              if chunk_balance != 1:
                  clusters.append(cluster)

          if clusters:
              results.append({
                  "summary": "The balancer is disabled on {} cluster(s)".format(len(clusters)),
                  "description": "The balancer process is disabled on the following cluster(s): {}. This causes uneven data distribution between shards. Please check the following documentation to learn more.".format(", ".join(clusters)),
                  "read_more_url": read_url.format("mongodb-chunk-imbalance"),
                  "severity": "warning",
                  "labels": {"count": str(len(clusters))},
              })
          return results
