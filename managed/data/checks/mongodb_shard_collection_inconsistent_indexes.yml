---
checks:
  - version: 2
    name: mongodb_shard_collection_inconsistent_indexes
    summary: MongoDB Inconsistent Indexes Across Shards
    description: Warns if there are inconsistent indexes across shards for sharded collections. Missing or inconsistent indexes across the shards can have a negative impact on performance.
    interval: standard
    technology: MONGODB
    category: Query
    subcategory: Index
    # author: Parag Bhayani
    queries:
      - type: METRICS_INSTANT
        query: avg by(cl_role,cluster,node_name,rs_state) (mongodb_ss_shardedIndexConsistency_numShardedCollectionsWithInconsistentIndexes{rs_state="1", node_name=~"{{.NodeName}}"})
    script: |
      read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"

      def check_context(docs, context):
          results = []

          clusters = []
          for row in docs[0]:
              cluster = row["metric"]["cluster"]
              inconsistent_index = int(row["value"][1])
              if inconsistent_index > 0:
                  clusters.append("{} ({} sharded collections)".format(cluster, inconsistent_index))

          if clusters:
              results.append({
                  "summary": "Inconsistent indexes across shards on {} cluster(s)".format(len(clusters)),
                  "description": "Inconsistent indexes detected across shards on the following cluster(s): {}. Either the indexes are missing in some shards or an index has inconsistent properties across collection's shards. To get inconsistent index details, kindly refer to Read More documentation.".format(", ".join(clusters)),
                  "read_more_url": read_url.format("mongodb-inconsistent-indexes-across-shards"),
                  "severity": "warning",
                  "labels": {"count": str(len(clusters))},
              })
          return results
