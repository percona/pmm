---
checks:
  - version: 2
    name: postgresql_expiring_passwd_check
    summary: Check for password expiration
    description: Check for passwords which are expiring and displays the time left before it expires
    #author: Jorge Torralba
    category: Security
    subcategory: Configuration
    interval: standard
    technology: POSTGRESQL
    queries:
      - type: POSTGRESQL_SELECT
        query: "rolname, rolvaliduntil::timestamp(0)::text, floor((extract(epoch from rolvaliduntil) - extract(epoch from now())) / 86400)::int AS expires FROM pg_roles WHERE rolvaliduntil IS NOT NULL"
    script: |
      def format_list(items, cap=10):
          if len(items) > cap:
              return "; ".join(items[:cap]) + "; and {} more".format(len(items) - cap)
          return "; ".join(items)

      def check_context(rows, context):
           results = []
           read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"
           roles = []
           for row in rows[0]:
               rolname, expires = row["rolname"], row["expires"]
               if expires <= 10:
                   roles.append("{} (expires in {} days)".format(rolname, expires))

           if roles:
               results.append({
                   "summary": "{} role(s) with passwords expiring within 10 days".format(len(roles)),
                   "description": "Passwords of the following roles are about to expire: {}.".format(format_list(roles)),
                   "read_more_url":read_url.format("postgresql-expiring-passwd"),
                   "severity": "warning",
                   "labels": {"count": str(len(roles))},
               })

           return results
