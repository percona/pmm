---
checks:
  - version: 2
    name: postgresql_version_check
    summary: Check for newer version of PostgreSQL
    description: This check returns an error if your PostgreSQL major version has reached end of life, a warning if it reaches end of life within 6 months, and otherwise a warning if a newer minor or major version is available.
    # author: Jorge Torralba
    category: Versions
    technology: POSTGRESQL
    queries:
      - type: POSTGRESQL_SELECT
        query: "setting, (setting::int / 10000) major  FROM pg_settings WHERE name = 'server_version_num' "
    script: |
      # The latest minor release of each major version, "Current minor" column:
      # https://www.postgresql.org/support/versioning/
      latest_versions = {
          "9.0": 90023,
          "9.1": 90124,
          "9.2": 90224,
          "9.3": 90325,
          "9.4": 90426,
          "9.5": 90525,
          "9.6": 90624,
          "10": 100023,
          "11": 110022,
          "12": 120022,
          "13": 130023,
          "14": 140025,
          "15": 150020,
          "16": 160016,
          "17": 170012,
          "18": 180007,
      }

      # https://www.postgresql.org/support/versioning/
      version_expires = {
          "9.0": "2015-10-08",
          "9.1": "2016-10-27",
          "9.2": "2017-11-09",
          "9.3": "2018-11-08",
          "9.4": "2020-02-13",
          "9.5": "2021-02-11",
          "9.6": "2021-11-11",
          "10": "2022-11-10",
          "11": "2023-11-09",
          "12": "2024-11-21",
          "13": "2025-11-13",
          "14": "2026-11-12",
          "15": "2027-11-11",
          "16": "2028-11-09",
          "17": "2029-11-08",
          "18": "2030-11-14",
      }

      minver = 9

      latestpg = 180007
      latest_and_greatest = "18.7"

      # A major version that reaches EOL within this many days gets a warning.
      WARN_DAYS = 183

      read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"

      security_line = " The newer release includes security fixes: https://www.postgresql.org/support/security/."


      def format_version(major, ver):
          if major >= 10:
             return "{}.{}".format(major, ver % 100)

          return "{}.{}.{}".format(major, ver // 100 % 100, ver % 100)


      def eol_result(series, current_version, eol_date, days, latest_for_current, ver):
          labels = {
              "current": current_version,
              "series": series,
              "eol_date": eol_date,
          }

          if days < 0:
              return {
                  "summary": "PostgreSQL {} reached end of life".format(series),
                  "description": "PostgreSQL {} reached its End-of-Life date on {}. EOL versions no longer receive bug or security fixes from the vendor. Upgrade to a supported major version.".format(series, eol_date),
                  "read_more_url": read_url.format("postgresql-version-check"),
                  "severity": "error",
                  "labels": labels,
              }

          description = "PostgreSQL {} End-of-Life date is {}. After that date it no longer gets bug fixes or security fixes. Plan your upgrade to a supported major version.".format(series, eol_date)
          if ver < latest_for_current:
              description += " Until then, upgrade to the newer minor version ({}).".format(format_version(int(series.split(".")[0]), latest_for_current)) + security_line

          return {
              "summary": "PostgreSQL {} reaches end of life on {}".format(series, eol_date),
              "description": description,
              "read_more_url": read_url.format("postgresql-version-check"),
              "severity": "warning",
              "labels": labels,
          }


      def check_context(rows, context):
           days_until = context.get("days_until", fail)
           results = []
           for row in rows[0]:
               ver, major = int(row["setting"]), int(row["major"])

               if major < minver:
                  results.append({
                      "summary": "Could not determine version information",
                      "description": "Unknown version",
                      "read_more_url": "",
                      "severity": "warning",
                      "labels": {},
                  })
                  return results

               series = str(major)
               if major < 10:
                  series = "{}.{}".format(major, ver // 100 % 100)

               # A major version newer than the tables gives no finding.
               if series not in latest_versions or series not in version_expires:
                  return []

               current_version = format_version(major, ver)
               latest_for_current = latest_versions[series]
               eol_date = version_expires[series]
               days = days_until(eol_date)

               # A major version past or near its EOL gets only the EOL finding: a newer minor version of it is no fix.
               if days <= WARN_DAYS:
                  results.append(eol_result(series, current_version, eol_date, days, latest_for_current, ver))
                  continue

               if ver < latest_for_current:
                  latest = format_version(major, latest_for_current)
                  description = "Current version is {}, the latest release of PostgreSQL {} is {}.".format(current_version, series, latest)
               elif ver < latestpg:
                  latest = latest_and_greatest
                  description = "Current version is {}, the latest release of PostgreSQL {}. A newer major version, {}, is available.".format(current_version, series, latest)
               else:
                  continue

               description += " PostgreSQL {} reaches end of life on {}.".format(series, eol_date)

               results.append({
                   "summary": "Newer version of PostgreSQL is available",
                   "description": description + security_line,
                   "read_more_url": read_url.format("postgresql-version-check"),
                   "severity": "warning",
                   "labels": {
                       "current": current_version,
                       "latest": latest,
                   },
               })

           return results
