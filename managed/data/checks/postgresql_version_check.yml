---
checks:
  - version: 2
    name: postgresql_version_check
    summary: Check for newer version of PostgreSQL
    description: Checks to see if the currently installed version is outdated for it's release level
    # author: Jorge Torralba
    category: Versions
    technology: POSTGRESQL
    queries:
      - type: POSTGRESQL_SELECT
        query: "setting, (setting::int / 10000) major  FROM pg_settings WHERE name = 'server_version_num' "
    script: |
      latest_versions = {
          "9.0": 90023,
          "9.1": 90124,
          "9.2": 90224,
          "9.3": 90325,
          "9.4": 90426,
          "9.5": 90525,
          "9.6": 90624,
          "10": 100023,
          "11": 110022,
          "12": 120022,
          "13": 130023,
          "14": 140024,
          "15": 150019,
          "16": 160015,
          "17": 170011,
          "18": 180006,
      }

      # https://www.postgresql.org/support/versioning/
      version_expires = {
          "9.0": "2015-10-09",
          "9.1": "2016-10-28",
          "9.2": "2017-11-10",
          "9.3": "2018-11-09",
          "9.4": "2020-02-10",
          "9.5": "2021-02-11",
          "9.6": "2021-11-11",
          "10": "2022-11-10",
          "11": "2023-11-09",
          "12": "2024-11-14",
          "13": "2025-11-13",
          "14": "2026-11-12",
          "15": "2027-11-11",
          "16": "2028-11-09",
          "17": "2029-11-08",
          "18": "2030-11-15",
      }

      minver = 9

      latestpg = 180006
      latest_and_greatest = "18.6"

      security_line = " The newer release includes security fixes: https://www.postgresql.org/support/security/."

      def days_left(major, days_until):
          daysleft = days_until(version_expires[str(major)])

          if daysleft < 0:
             return "WARNING: The version currently installed expired {} days ago.".format(-daysleft)

          return "NOTE: Support for current version will end in {} days.".format(daysleft)


      def format_version(major, ver):
          if major >= 10:
             minor = int(ver) % 100
             fmt_version = "{}.{}".format(major, minor)

          if major <= 9:
             minor = int(ver) // 100  % 100
             patch = int(ver) % 100
             fmt_version = "{}.{}.{}".format(major, minor, patch)

          return fmt_version


      def check_context(rows, context):
           days_until = context.get("days_until", fail)
           results = []
           read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"
           description = ""
           daysleft = ""
           minoroutdated = False
           majoroutdated = False
           for row in rows[0]:
               ver, major = row["setting"], row["major"]

               major = int(major)

               #hard code for testing
               #ver = 90022
               #major = 9

               if str(major) == "" or int(major) < minver :
                  results.append({
                      "summary": "Could not determine version information",
                      "description": "Unknown version",
                      "read_more_url": "",
                      "severity": "warning",
                      "labels": {},
                  })
                  return results

               if major >= 10:
                   current_version = format_version(major, ver)
                   latest_for_current = latest_versions[str(major)]
                   daysleft = days_left(major, days_until)
                   if int(ver) < latest_for_current:
                      latest_current = format_version(major, latest_for_current)
                      description = "There is a newer minor version ({}) available. ".format(latest_current)
                      description += daysleft
                      minoroutdated = True

               if major < 10:
                   minor = int(ver) // 100  % 100
                   realmajor = "{}.{}".format(major, minor)
                   current_version = format_version(major, ver)
                   latest_for_current = latest_versions[str(realmajor)]
                   daysleft = days_left(realmajor, days_until)
                   if int(ver) < latest_for_current:
                      latest_current = format_version(major, latest_for_current)
                      description = "There is a newer minor version ({}) available. ".format(latest_current)
                      description += daysleft
                      minoroutdated = True

               if int(ver) < int(latestpg) and minoroutdated == False:
                      majoroutdated = True
                      description = "Version ({}) is the latest release for this major/minor version. However, there is a newer major version ({}) available. ".format(current_version, latest_and_greatest)
                      description += daysleft

               description += security_line

               results.append({
                   "summary": "Currently installed version is ({})".format(current_version),
                   "description": description,
                   "read_more_url":read_url.format("postgresql-version-check"),
                   "severity": "warning",
                   "labels": {},
               })


           if minoroutdated == False and majoroutdated == False:
              return []

           return results
