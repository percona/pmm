---
checks:
  - version: 2
    name: mysql_innodb_redo_logs_not_sized_correctly
    summary: Checks if InnoDB redo log size is not configured correctly.
    description: This check reviews InnoDB redo log size and suggests if it is configured too low.
    family: MYSQL
    category: performance
    #subcategory: configuration
    #author: Kedar Vaijanapurkar
    advisor: configuration_innodb
    interval: standard
    queries:
      - type: MYSQL_SELECT
        query: "@@global.version as version, @@global.hostname as service"
      - type: METRICS_RANGE
        query: avg by (service_name) (increase(mysql_global_status_innodb_os_log_written{service_name=~"{{.ServiceName}}"}[1h]))
        parameters:
          range: 168h
          step: 5m
      - type: METRICS_INSTANT
        query: avg by (service_name) (mysql_innodb_redo_log_capacity_bytes{service_name=~"{{.ServiceName}}"}) or avg by (service_name) (mysql_global_variables_innodb_redo_log_capacity{service_name=~"{{.ServiceName}}"}) or avg by (service_name) (mysql_global_variables_innodb_log_files_in_group{service_name=~"{{.ServiceName}}"} * mysql_global_variables_innodb_log_file_size{service_name=~"{{.ServiceName}}"}) or avg by (service_name) (mysql_global_variables_innodb_log_file_size{service_name=~"{{.ServiceName}}"})
        parameters:
          lookback: 5m
      # Checkpoint age as a percentage, kept in two separate arms so that each
      # can be compared against its own trigger. Synchronous flushing - what
      # this check warns about - begins at the sync flush threshold, so that is
      # the denominator we want wherever it is available.
      #
      #   * docs[3], preferred: percentage of the sync flush threshold.
      #     Innodb_checkpoint_max_age on Percona Server, MySQL 5.7 and MariaDB;
      #     the log_max_modified_age_sync row of INNODB_METRICS on Oracle MySQL
      #     8.0.30+ and 9.x. That row is DISABLED by default - only 74 of 314
      #     rows are enabled on a stock 8.0.46 - so this arm exists only where
      #     the operator has set innodb_monitor_enable.
      #   * docs[4], fallback: percentage of total redo log capacity, from
      #     mysql_innodb_redo_log_checkpoint_age_ratio. A stock Oracle MySQL
      #     lands here, so this is the common case rather than the exception.
      #
      # The two are not interchangeable. The sync threshold is ~83% of capacity
      # (87,086,592 of 104,857,600 on MySQL 8.0.46; 87,417,344 of 104,857,600 on
      # Percona Server 8.4.6), so 80% of the threshold is only ~66% of capacity.
      # Comparing the capacity arm against 80 would fire at ~96% of the
      # threshold, once synchronous flushing is already imminent, which is why
      # the script applies a different trigger per arm. That ratio is not a
      # fixed constant across servers, so 66 is an approximation chosen to
      # preserve lead time rather than to be exact.
      - type: METRICS_RANGE
        query: " (avg by (service_name) (max_over_time(mysql_global_status_innodb_checkpoint_age{service_name=~\"{{.ServiceName}}\"}[1h]) or max_over_time(mysql_info_schema_innodb_metrics_log_log_lsn_checkpoint_age{service_name=~\"{{.ServiceName}}\"}[1h]) or max_over_time(mysql_info_schema_innodb_metrics_recovery_log_lsn_checkpoint_age_total{service_name=~\"{{.ServiceName}}\"}[1h]))) * 100 / (avg by (service_name) (max_over_time(mysql_global_status_innodb_checkpoint_max_age{service_name=~\"{{.ServiceName}}\"}[1h]) or max_over_time(mysql_info_schema_innodb_metrics_log_log_max_modified_age_sync{service_name=~\"{{.ServiceName}}\"}[1h]) or max_over_time(mysql_info_schema_innodb_metrics_recovery_log_max_modified_age_sync{service_name=~\"{{.ServiceName}}\"}[1h]) or max_over_time(mysql_info_schema_innodb_metrics_log_log_max_modified_age_async{service_name=~\"{{.ServiceName}}\"}[1h]) or max_over_time(mysql_info_schema_innodb_metrics_recovery_log_max_modified_age_async{service_name=~\"{{.ServiceName}}\"}[1h])))"
        parameters:
          range: 168h
          step: 5m
      - type: METRICS_RANGE
        query: avg by (service_name) (max_over_time(mysql_innodb_redo_log_checkpoint_age_ratio{service_name=~"{{.ServiceName}}"}[1h])) * 100
        parameters:
          range: 168h
          step: 5m
    script: |
      read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"
      def redo_log_check(docs):
          # Guarded like docs[1..3] below: an empty result would leave version
          # and service unbound and raise NameError at the .format() calls.
          if len(docs[0]) == 0:
              return None
          version = ""
          service = ""
          for row in docs[0]:
              version = row["version"]
              service = row["service"]

          cnt = 0
          cnt_high = 0
          logs_written_tot = 0
          logs_written_max = 0
          logs_written_avg = 0
          redo_log_size = 0

          # MySQL 8.0.30 replaced innodb_log_file_size/innodb_log_files_in_group with
          # innodb_redo_log_capacity, and MySQL 9.x dropped the legacy variables
          # entirely. Both spellings are queried, but if neither is exposed there is
          # no size to compare the written redo against, so bail out instead of
          # falling through with a zero size and flagging every sample as a spike.
          if len(docs[2]) == 0:
              return None
          redo_log_size = int(float(docs[2][0]["value"][1]))
          if redo_log_size <= 0:
              return None

          if len(docs[1]) == 0 or len(docs[1][0]["values"]) == 0:
              return None

          # Sample values arrive as strings and increase() can yield fractional
          # results, so parse them as floats. int() would reject "123.5".
          for row in docs[1][0]["values"]:
              logs_written = float(row[1])
              logs_written_tot = logs_written_tot + logs_written
              if logs_written_max < logs_written:
                logs_written_max = logs_written
              cnt = cnt + 1
              if logs_written > redo_log_size:
                  cnt_high = cnt_high + 1
          logs_written_avg = logs_written_tot / cnt / 1024 / 1024

          chkpt_alert = 0
          # Each arm carries its own trigger because the denominators differ:
          # 80% of the sync flush threshold, or the equivalent ~66% of total
          # redo log capacity. Prefer the threshold arm where it exists.
          # Checkpoint age samples are optional either way. Without them only
          # the checkpoint age error below is skipped, the write volume warning
          # still applies since it needs docs[1] and docs[2] only.
          chkpt_samples = []
          chkpt_limit = 80
          if len(docs[3]) > 0:
              chkpt_samples = docs[3][0]["values"]
          elif len(docs[4]) > 0:
              chkpt_samples = docs[4][0]["values"]
              chkpt_limit = 66
          for row in chkpt_samples:
              if float(row[1]) > chkpt_limit:
                  chkpt_alert = chkpt_alert + 1

          if chkpt_alert > 1:
              return {
                  "summary": "Redo log size check.",
                  "read_more": "https://percona.com/blog",
                  "description": "Current total redo log size is {}M. It is noted that the checkpoint age is utilizing more than 80% of the synchronous flush threshold, or more than the equivalent ~66% of total redo log capacity on servers that do not expose that threshold (stock Oracle MySQL, where the INNODB_METRICS log rows are disabled by default). The two are measured against different limits, so the raw percentage is not comparable between servers. In such cases the blocks are flushed synchronously and can cause the degraded performance. It is important to revise the redo_log_size. The average redo written per hour over the past 7 days is {}M with spikes above redo_log_size being {}% of total samples with max written redolog size being {}M.".format(int(redo_log_size/1024/1024),int(logs_written_avg), int(cnt_high*100/cnt),int(logs_written_max/1024/1024)),
                  "severity": "error",
                  "labels": {
                      "mysql_version": "{}".format(version),
                      "service": "{}".format(service),
                  },
                  "read_more_url":read_url.format("innodb_redo_logs_not_sized_correctly")
              }
          if int(cnt_high*100/cnt) > 5:
              return {
                  "summary": "Redo log size check.",
                  "read_more": "https://percona.com/blog",
                  "description": "Current total redo log size is {}M. The relo log written are more than the configured though this hasn't caused system degradation. The average redo written per hour over the past 7 days is {}M with spikes above redo_log_size being {}% of total samples with max written redolog size being {}M. ".format(int(redo_log_size/1024/1024),int(logs_written_avg), int(cnt_high*100/cnt),int(logs_written_max/1024/1024)),
                  "severity": "warning",
                  "labels": {
                      "mysql_version": "{}".format(version),
                      "service": "{}".format(service),
                  },
                  "read_more_url":read_url.format("innodb_redo_logs_not_sized_correctly")
              }

      def check_context(docs,context):
          results = []
          tmp_redo_log_check = redo_log_check(docs)
          if tmp_redo_log_check:
              results.append(tmp_redo_log_check)
          return results
