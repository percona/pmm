---
checks:
  - version: 2
    name: postgresql_table_autovac_settings
    summary: Check whether there is any table level autovacuum settings
    description: This check returns those tables where autovacuum parameters are specified along with autovacuum settings specified
    technology: POSTGRESQL
    # author: Jobin Augustine
    category: Configuration
    subcategory: Vacuum
    interval: standard
    queries:
      - type: POSTGRESQL_SELECT
        query: " * FROM (SELECT c.relname, pg_catalog.array_to_string(c.reloptions || array(select 'toast.' || x from pg_catalog.unnest(tc.reloptions) x), ', ')  as opts FROM pg_catalog.pg_class c LEFT JOIN pg_catalog.pg_class tc ON (c.reltoastrelid = tc.oid) ) AS tabopts WHERE opts like '%vacuum%'"
    script: |
      read_url = "https://docs.percona.com/percona-monitoring-and-management/3/advisors/checks/{}.html"

      # pg_advisor
      # thresholds
      # RECOMMENDED_MAX_VALUE="on"

      def format_list(items, cap=10):
          if len(items) > cap:
              return "; ".join(items[:cap]) + "; and {} more".format(len(items) - cap)
          return "; ".join(items)

      def check_context(docs, context):
          results = []
          tables = []
          for row in docs[0]:
              tables.append("{} ({})".format(row["relname"], row["opts"]))

          if tables:
              results.append({
                  "summary": "{} table(s) with table-level autovacuum settings".format(len(tables)),
                  "description": "The following tables override the global autovacuum settings: {}.".format(format_list(tables)),
                  "read_more_url": read_url.format("postgresql-tables-per-table-vacuum-settings"),
                  "severity": "warning",
                  "labels": {"count": str(len(tables))},
              })

          return results
